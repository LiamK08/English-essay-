<style>
/* ── Pit & Stage ─────────────────────────────────────────────────────────
   Palette follows the essay's own annotation key: seam green = fixed theme,
   signal red = adapt to the question, lamp amber = Turn, stage blue = Close.
   Ground is coal / chalk; neutrals carry a cool slate bias.               */
:root{
  --bg:#EFEEE9; --bg2:#E7E5DE; --surf:#FCFBF8; --surf2:#F3F1EB;
  --ink:#15181D; --ink2:#39404A; --mut:#6A7280; --line:#D9D6CC; --line2:#C6C2B6;
  --lamp:#9C6608; --lampSoft:rgba(156,102,8,.11);
  --stage:#215B93; --stageSoft:rgba(33,91,147,.11);
  --seam:#456D1D; --seamSoft:rgba(69,109,29,.12);
  --sig:#A82C23; --sigSoft:rgba(168,44,35,.10);
  --good:#2C7442; --bad:#A82C23;
  --sh:0 1px 2px rgba(20,24,30,.05), 0 10px 26px rgba(20,24,30,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --bg2:#090B0E; --surf:#171A20; --surf2:#1F232B;
  --ink:#ECEDEF; --ink2:#C5C9D0; --mut:#8C939F; --line:#292E37; --line2:#39404C;
  --lamp:#E3A63E; --lampSoft:rgba(227,166,62,.13);
  --stage:#7CB4ED; --stageSoft:rgba(124,180,237,.13);
  --seam:#96C763; --seamSoft:rgba(150,199,99,.13);
  --sig:#F08074; --sigSoft:rgba(240,128,116,.12);
  --good:#5FC98A; --bad:#F08074;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.38);
}}
:root[data-theme="dark"]{
  --bg:#0E1013; --bg2:#090B0E; --surf:#171A20; --surf2:#1F232B;
  --ink:#ECEDEF; --ink2:#C5C9D0; --mut:#8C939F; --line:#292E37; --line2:#39404C;
  --lamp:#E3A63E; --lampSoft:rgba(227,166,62,.13);
  --stage:#7CB4ED; --stageSoft:rgba(124,180,237,.13);
  --seam:#96C763; --seamSoft:rgba(150,199,99,.13);
  --sig:#F08074; --sigSoft:rgba(240,128,116,.12);
  --good:#5FC98A; --bad:#F08074;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100dvh;font-size:16px}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--stage)}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1040px;margin:0 auto;padding:0 18px calc(64px + env(safe-area-inset-bottom))}

/* header: faint wire mesh — the gym cage / pit cage motif */
header.top{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg2);
  padding:max(14px,env(safe-area-inset-top)) 0 14px;margin-bottom:22px}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:repeating-linear-gradient(45deg,var(--line2) 0 1px,transparent 1px 15px),
                   repeating-linear-gradient(-45deg,var(--line2) 0 1px,transparent 1px 15px);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 78%);
          mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 78%)}
.topin{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:var(--serif);font-size:19px;line-height:1.1;margin-right:auto;cursor:pointer;min-width:0}
.mark b{display:block;font-weight:600;letter-spacing:.01em}
.mark span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.lamp{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 10px}
.lamp .dot{width:11px;height:11px;border-radius:50%;background:var(--lamp);flex:0 0 auto;
  box-shadow:0 0 0 0 var(--lampSoft);transition:box-shadow .5s,opacity .5s}
.lamp b{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.lamp small{color:var(--mut);font-size:11px}

.btn{font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:var(--surf);
  border:1px solid var(--line2);border-radius:11px;padding:10px 15px;cursor:pointer;
  transition:transform .07s,background .15s,border-color .15s}
.btn:hover{background:var(--surf2);border-color:var(--mut)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--lamp);border-color:transparent;color:var(--bg2)}
.btn.pri:hover{filter:brightness(1.08);background:var(--lamp)}
.btn.gh{background:transparent;border-color:var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.ic{padding:0;width:38px;height:38px;display:grid;place-items:center;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surf)}
.chip.seam{color:var(--seam);border-color:var(--seam);background:var(--seamSoft)}
.chip.sig{color:var(--sig);border-color:var(--sig);background:var(--sigSoft)}
.chip.lampc{color:var(--lamp);border-color:var(--lamp);background:var(--lampSoft)}
.chip.stagec{color:var(--stage);border-color:var(--stage);background:var(--stageSoft)}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:18px}
.panel > h2{font-size:20px;margin-bottom:4px}
.lead{color:var(--mut);font-size:14px;max-width:66ch}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}

/* dashboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:620px){.hero{grid-template-columns:1fr}}
.ring{--p:0;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--lamp) calc(var(--p)*3.6deg), var(--line) 0)}
.ring i{width:84px;height:84px;border-radius:50%;background:var(--surf);display:grid;place-items:center;
  font-family:var(--mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;font-style:normal}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.tile b{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;display:block}
.tile small{color:var(--mut);font-size:11.5px}

.secbars{display:grid;gap:9px;margin-top:6px}
.secbar{display:grid;grid-template-columns:112px 1fr 46px;gap:11px;align-items:center;font-size:13.5px}
@media(max-width:520px){.secbar{grid-template-columns:88px 1fr 42px;font-size:12.5px}}
.secbar span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--lamp);border-radius:999px;transition:width .45s}
.secbar em{font-family:var(--mono);font-size:12px;font-style:normal;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
.mode{text-align:left;display:grid;gap:3px;padding:14px;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,transform .07s}
.mode:hover{border-color:var(--lamp)}
.mode:active{transform:translateY(1px)}
.mode b{font-size:15px}
.mode small{color:var(--mut);font-size:12.5px;line-height:1.45}
.mode .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}

/* essay rendering */
.prose{font-family:var(--serif);font-size:17.5px;line-height:1.72;color:var(--ink);max-width:66ch}
.prose + .prose{margin-top:14px}
.fixed{color:var(--seam);font-style:italic}
.adapt{color:var(--sig);background:var(--sigSoft);border-radius:4px;padding:0 3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.band{border-left:3px solid var(--line);padding:11px 0 11px 15px;margin-top:15px;font-family:var(--serif);font-size:17px;line-height:1.65}
.band.turn{border-color:var(--lamp)}
.band.close{border-color:var(--stage)}
.band b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
.band.turn b{color:var(--lamp)} .band.close b{color:var(--stage)}

.ev{display:grid;grid-template-columns:1.15fr 1fr 1.35fr;gap:0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin-top:12px;background:var(--surf)}
@media(max-width:760px){.ev{grid-template-columns:1fr}}
.ev > div{padding:13px 15px;border-right:1px solid var(--line)}
.ev > div:last-child{border-right:0}
@media(max-width:760px){.ev > div{border-right:0;border-bottom:1px solid var(--line)}
  .ev > div:last-child{border-bottom:0}}
.ev .q{font-family:var(--serif);font-size:16px;border-left:3px solid var(--lamp)}
.ev .q small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-top:7px}
.ev .t{font-size:14px;color:var(--ink2)}
.ev ul{margin:0;padding-left:17px;font-size:14.3px;color:var(--ink2)}
.ev li + li{margin-top:7px}

/* drill runner */
.cue{background:var(--surf2);border:1px solid var(--line);border-left:3px solid var(--lamp);
  border-radius:10px;padding:13px 15px;margin-bottom:14px}
.cue .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.cue .txt{font-family:var(--serif);font-size:17px;line-height:1.6}
.cue .sub{font-size:13.5px;color:var(--mut);margin-top:7px}
.field{width:100%;font:inherit;font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);
  background:var(--surf2);border:1px solid var(--line2);border-radius:11px;padding:13px 14px;resize:vertical}
.field:focus{border-color:var(--lamp);outline:none;background:var(--surf)}
.progress{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--lamp);transition:width .3s}
.marked{font-family:var(--serif);font-size:17px;line-height:1.75}
.marked .ok{color:var(--good)}
.marked .no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.marked .ex{color:var(--mut);opacity:.7}
.score{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 8px;font-variant-numeric:tabular-nums}
.model{font-family:var(--serif);font-size:16.5px;line-height:1.65;color:var(--ink2);
  border-left:3px solid var(--line2);padding-left:13px;margin-top:11px}
.checks{display:grid;gap:7px;margin-top:10px}
.check{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;font-size:14.5px}
.check b{font-family:var(--mono);font-size:14px}
.check.y b{color:var(--good)} .check.n b{color:var(--bad)}
.check.n span{color:var(--mut)}
.gradebtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.gradebtns .btn.suggest{border-color:var(--lamp);box-shadow:0 0 0 3px var(--lampSoft)}

/* first letters */
.fl{font-family:var(--mono);font-size:15.5px;line-height:2.05;letter-spacing:.02em}
.fl .w{cursor:pointer;padding:1px 2px;border-radius:4px}
.fl .w:hover{background:var(--lampSoft)}
.fl .w.shown{color:var(--lamp);background:var(--lampSoft)}

/* match game */
.opts{display:grid;gap:9px;margin-top:14px}
.opt{text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--surf2);
  border:1px solid var(--line2);border-radius:11px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--lamp)}
.opt.y{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.n{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt small{display:block;color:var(--mut);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;margin-top:5px}

.timer{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad)}
table.plan{width:100%;border-collapse:collapse;font-size:14.5px}
table.plan th,table.plan td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.note{font-size:14.3px;color:var(--ink2);max-width:70ch}
.note + .note{margin-top:10px}
ul.tight{margin:8px 0 0;padding-left:19px;font-size:14.3px;color:var(--ink2)}
ul.tight li + li{margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.on{opacity:1}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin-top:26px;font-family:var(--mono);letter-spacing:.06em}
</style>
</head>

<header class="top"><div class="wrap"><div class="topin">
  <button class="mark" data-act="home" style="font:inherit;background:none;border:0;padding:0;color:inherit;text-align:left">
    <b>Billy Elliot</b><span>Common Module · Shell</span>
  </button>
  <div class="lamp" title="Lines mastered — recalled correctly three times, spaced">
    <span class="dot" id="lampDot"></span><b id="lampPct">0%</b><small id="lampSub">learnt</small>
  </div>
  <button class="btn ic gh" data-act="theme" title="Switch theme" aria-label="Switch theme">◐</button>
</div></div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ESSAY.  [] = adapt to the question.  {} = fixed theme wording.
   ═══════════════════════════════════════════════════════════════════════ */
const SECTIONS = [
{
  id:"intro", short:"Intro", name:"Introduction",
  lines:[
    {id:"intro.1", label:"Opening claim", text:"Texts can illuminate the complexities of the human experience by revealing [how individuals navigate and resist the forces that seek to define them]."},
    {id:"intro.2", label:"Text and context", text:"Stephen Daldry’s film Billy Elliot (2000), set in the politically turbulent landscape of Thatcher-era England, explores the intersections of class, gender and self-expression to demonstrate how identity is shaped and challenged."},
    {id:"intro.3", label:"Three-part roadmap", text:"Through cinematic techniques and nuanced characterisation, Daldry critiques {the inherited codes that confine a community to a single way of living}, interrogates {the defiance demanded of those who pursue a self their world has no language for}, and ultimately celebrates {the acceptance through which one life can transform the collective that once denied it}."},
    {id:"intro.4", label:"What the audience leaves with", text:"By charting Billy’s paradoxical pursuit of ballet within a mining town defined by tradition, Daldry invites audiences to reconsider [their preconceived assumptions about who is permitted to belong] and recognise that [a life so transformed is never won without cost]."}
  ]
},
{
  id:"b1", short:"Body 1", name:"Body 1 — The restrictive environment",
  shell:{id:"b1.shell", text:"When a community’s survival appears to depend on conformity, [the codes that once secured belonging harden into constraint], leaving individuals little room to discover who they might otherwise become."},
  context:{id:"b1.ctx", text:"Daldry reflects the hypermasculine culture of a County Durham pit village during the 1984-85 miners’ strike, where work and identity passed down the male line, exposing how a community under economic siege comes to read difference as betrayal."},
  cards:[
    {id:"b1.c1", cue:"Jackie lists what lads are allowed to do", who:"Jackie",
     quote:"“Lads do football… or boxing… or wrestling. Not friggin’ ballet.”",
     tech:["Shot/reverse shot","tight close-ups","reductive listing"],
     evals:["The cutting denies father and son a shared frame, presenting the code as inherited rather than reasoned",
            "The exhaustiveness of the list exposes a community with no vocabulary for a boy who wants otherwise"]},
    {id:"b1.c2", cue:"George rounds on Billy in the boxing hall", who:"George, boxing hall",
     quote:"“You’re a disgrace to them gloves, your father, and the traditions of this boxing hall.”",
     tech:["Long shot of Jackie behind the gym cage, symbol of entrapment","invective dialogue","tricolon"],
     evals:["Tricolon fuses sport, family and heritage into one inherited duty, so failure in the ring becomes failure of belonging",
            "The wire framing Jackie marks him as prisoner of the very code he is enforcing"]},
    {id:"b1.c3", cue:"Jackie, asked about London — the furthest he has ever been", who:"Jackie, on London",
     quote:"“I never made it past Durham.”",
     tech:["Understatement","colloquial dialogue"],
     evals:["Understatement compresses a lifetime of foreclosed horizons into a single flat clause",
            "The environment restricts not from malice but because it was itself defeated"], turnAt:1}
  ],
  turn:{id:"b1.turn", text:"Yet such constraint is born of defeat rather than malice: Jackie polices horizons he was never permitted to cross."},
  close:{id:"b1.close", text:"Daldry positions audiences to recognise such environments as the reflex of communities under siege, where restriction becomes the last form of belonging still affordable."}
},
{
  id:"b2", short:"Body 2", name:"Body 2 — Resistance to social pressure",
  shell:{id:"b2.shell", text:"Resistance to social pressure reveals that [private passion can articulate a self for which a community has no language], so that determination becomes less an act of rebellion than an insistence upon being fully known."},
  context:{id:"b2.ctx", text:"Daldry criticises the absolute solidarity the strike demanded of its own, challenging the sacrifice of individual identity and promoting a reassessment of the male stoicism that made such sacrifice seem natural."},
  cards:[
    {id:"b2.c1", cue:"The line Billy returns to whenever he doubts himself", who:"mother’s letter",
     quote:"“Always be yourself.”",
     tech:["Recurring motif","imperative mood"],
     evals:["Recurring at every point of doubt, the imperative licenses his difference through maternal love",
            "Defiance is reframed as fidelity to the self rather than betrayal of the family"]},
    {id:"b2.c2", cue:"What Billy does instead of arguing, once Jackie forbids ballet", who:"", scene:true,
     quote:"Dance of defiance scene, after Jackie forbids ballet",
     tech:["Montage of axial jump cuts","triumphal non-diegetic crescendo","shot from behind the gym cage"],
     evals:["The montage holds Billy centred as argument gives way to movement, locating articulacy in the body",
            "The wire framing his freest moment insists the town’s constraint has not gone anywhere"]},
    {id:"b2.c3", cue:"Billy defends himself to Michael", who:"Billy to Michael",
     quote:"“Just because I like ballet doesn’t mean I’m a poof, you know.”",
     tech:["Shot/reverse shot","close-up on facial reactions","honest dialogue"],
     evals:["Cutting to Michael’s face makes the cost of Billy’s defence visible on screen",
            "He claims his own difference in the idiom that condemns his friend’s, so resistance stays entangled with prejudice"], turnAt:1}
  ],
  turn:{id:"b2.turn", text:"Yet such resistance is rarely pure: he defends dance in the idiom used to condemn it, and at the expense of the friend that idiom targets."},
  close:{id:"b2.close", text:"Daldry positions audiences to value resistance precisely because it is imperfect: courage is managed in fragments, never simply possessed."}
},
{
  id:"b3", short:"Body 3", name:"Body 3 — Acceptance and transformation",
  shell:{id:"b3.shell", text:"When acceptance is finally granted, [transformation extends beyond the individual to the collective that once withheld it], though the freedom one person gains is seldom won without another’s sacrifice."},
  context:{id:"b3.ctx", text:"Daldry reflects the shifting sociocultural values of the late twentieth century, looking back in 2000 with fifteen years’ hindsight on the strike’s defeat, championing a more inclusive society while refusing to forget what its progress cost."},
  cards:[
    {id:"b3.c1", cue:"Jackie breaks the strike at the pit gates, Tony chasing him", who:"Jackie, pit gates, pursued by Tony",
     quote:"“Give the boy a chance.”",
     tech:["High-angle long shot","diegetic cacophony of the crowd","picket line as symbol"],
     evals:["The high angle diminishes Jackie inside the collective he is breaking faith with",
            "Acceptance is measured as the surrender of everything that made him legible to his own community"]},
    {id:"b3.c2", cue:"Billy answers the Royal Ballet panel — what it feels like to dance", who:"Billy, Royal Ballet audition",
     quote:"“Flyin’ like a bird. Like electricity.”",
     tech:["Framing that isolates Billy across the examiners’ table","simile"],
     evals:["The table between Billy and the panel frames the class line he is crossing",
            "He reaches for simile because Everington gave him no other language for what he feels"]},

const SAVE="be_recall_v1", CRIT=3, MIN=60000;
const IVL=[9, 55, 300, 1440, 4320];          /* expanding gaps, in minutes */
function blank(){ return {srs:{}, streak:{n:0,last:null}, sessions:0, adapt:{}, exams:[], theme:null, seenPlan:false}; }
let S=(function(){ try{ const r=JSON.parse(localStorage.getItem(SAVE)); if(r&&typeof r==="object") return Object.assign(blank(),r);}catch(e){} return blank(); })();
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify(S)); }catch(e){} }
function srs(id){ return S.srs[id] || (S.srs[id]={reps:0,lapses:0,due:0,seen:0,started:false}); }
function mastered(it){ const r=S.srs[it.id]; return !!r && r.reps>=CRIT; }
function pctOf(list){ if(!list.length) return 0;
  let t=0; list.forEach(it=>{ const r=S.srs[it.id]; t+=Math.min(CRIT, r?r.reps:0)/CRIT; });
  return Math.round(t/list.length*100); }
function itemsOf(sid){ return ITEMS.filter(i=>i.sec===sid); }
function overall(){ return pctOf(ITEMS); }
function dueNow(){ const t=Date.now(); return ITEMS.filter(i=>{ const r=S.srs[i.id]; return r&&r.started&&r.reps<CRIT&&r.due<=t; }); }
function fresh(){ return ITEMS.filter(i=>{ const r=S.srs[i.id]; return !r||!r.started; }); }
function weak(){ return ITEMS.filter(i=>{ const r=S.srs[i.id]; return r&&r.lapses>0&&r.reps<CRIT; })
  .sort((a,b)=>S.srs[b.id].lapses-S.srs[a.id].lapses); }
function grade(id,g){
  const r=srs(id); r.started=true; r.seen++;
  if(g===2){ r.reps++; r.due=Date.now()+IVL[Math.min(r.reps-1,IVL.length-1)]*MIN; }
  else if(g===1){ r.due=Date.now()+6*MIN; }
  else { r.reps=0; r.lapses++; r.due=Date.now()+90000; }
  save();
}
function bumpStreak(){ const d=new Date().toDateString(); const s=S.streak;
  if(s.last===d) return; const y=new Date(Date.now()-864e5).toDateString();
  s.n = (s.last===y)? s.n+1 : 1; s.last=d; S.sessions++; save(); }

/* ═══ text tools ════════════════════════════════════════════════════════ */
const STOP=new Set("a an the and or but so of to in on at for with as is are was were be been being it its his her their this that these those not no into from than then there here which who whom what when where how by".split(" "));
function clean(t){ return String(t).replace(/[\[\]{}]/g,""); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toks(t){ /* keep separators so marked output reads naturally */
  const out=[],re=/[A-Za-z0-9’'’]+/g; let last=0,m;
  while((m=re.exec(t))){ if(m.index>last) out.push({t:"s",x:t.slice(last,m.index)});
    out.push({t:"w",x:m[0]}); last=m.index+m[0].length; }
  if(last<t.length) out.push({t:"s",x:t.slice(last)});
  return out; }
function norm(w){ return w.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,"").replace(/'s$/,""); }
function words(t){ return (clean(t).match(/[A-Za-z0-9’'’]+/g)||[]).map(norm).filter(Boolean); }
function ed(a,b){ const n=a.length,m=b.length; if(!n)return m; if(!m)return n;
  let prev=new Array(m+1); for(let j=0;j<=m;j++)prev[j]=j;
  for(let i=1;i<=n;i++){ const cur=[i];
    for(let j=1;j<=m;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[m]; }
function eqw(a,b){ if(a===b) return true; const L=Math.max(a.length,b.length);
  return ed(a,b) <= (L<=3?0:L<=6?1:2); }                    /* forgive typos */
function lcsOps(A,B){                       /* A = target words, B = typed  */
  const n=A.length,m=B.length, dp=[];
  for(let i=0;i<=n;i++) dp.push(new Int32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]= eqw(A[i],B[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){ if(eqw(A[i],B[j])){ops.push({o:"ok",i:i});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push({o:"miss",i:i});i++;}
    else {ops.push({o:"ex",x:B[j]});j++;} }
  while(i<n){ops.push({o:"miss",i:i});i++;}
  while(j<m){ops.push({o:"ex",x:B[j]});j++;}
  return {ops, hit:dp[0][0]}; }
function markVerbatim(target,typed){
  const tk=toks(clean(target)), A=[], map=[];
  tk.forEach((t,k)=>{ if(t.t==="w"){ A.push(norm(t.x)); map.push(k); } });
  const B=words(typed), {ops,hit}=lcsOps(A,B);
  const state={}; ops.forEach(o=>{ if(o.o!=="ex") state[o.i]=o.o; });
  let wi=-1, html="";
  tk.forEach(t=>{ if(t.t==="s"){ html+=esc(t.x); return; }
    wi++; html+='<span class="'+(state[wi]==="ok"?"ok":"no")+'">'+esc(t.x)+"</span>"; });
  const extra=ops.filter(o=>o.o==="ex").length;
  return {html, pct:A.length?Math.round(hit/A.length*100):100, extra, total:A.length};
}
function markContent(target,typed){        /* evaluation clauses: key ideas */
  const A=words(target).filter(w=>!STOP.has(w)), B=words(typed);
  if(!A.length) return {pct:100, missing:[]};
  const {hit}=lcsOps(A,B);
  const got=new Set(); const ops=lcsOps(A,B).ops;
  ops.forEach(o=>{ if(o.o==="ok") got.add(o.i); });
  return {pct:Math.round(hit/A.length*100), missing:A.filter((w,k)=>!got.has(k))};
}
function hasPhrase(hay,phrase){            /* fuzzy "did they write this?"  */
  const A=words(phrase), B=words(hay); if(!A.length) return false;
  return lcsOps(A,B).hit/A.length >= 0.7; }
function renderProse(t){ return esc(t)
  .replace(/\[([^\]]+)\]/g,'<span class="adapt">$1</span>')
  .replace(/\{([^}]+)\}/g,'<span class="fixed">$1</span>')
  .replace(/Billy Elliot/g,"<em>Billy Elliot</em>"); }
function shorten(t,n){ t=clean(t); return t.length>n? t.slice(0,n-1)+"…" : t; }

    html=`<div class="checks">${hits.map(h=>`<div class="check ${h.y?"y":"n"}"><b>${h.y?"✓":"✗"}</b><span>${esc(h.t)}</span></div>`).join("")}</div>`;
  } else if(it.kind==="eval"){
    const m=markContent(it.text,typed); pct=m.pct;
    const v=markVerbatim(it.text,typed);
    html=`<div class="marked">${v.html}</div>`;
    if(m.missing.length) extra=`<p class="lead" style="margin-top:9px">Key words you left out: <b style="color:var(--sig)">${m.missing.map(esc).join(", ")}</b></p>`;
  } else {
    const v=markVerbatim(it.text,typed); pct=v.pct;
    html=`<div class="marked">${v.html}</div>`;
    if(v.extra) extra=`<p class="lead" style="margin-top:9px">${v.extra} word${v.extra>1?"s":""} you added that aren’t in the line.</p>`;
  }
  const sug = pct>=93?2 : pct>=68?1 : 0;
  R.phase="mark"; R.pct=pct;
  const bar=app.querySelector(".panel");
  bar.insertAdjacentHTML("beforeend",`
    <div style="margin-top:18px;padding-top:15px;border-top:1px solid var(--line)">
      <div class="score">${pct}% ${it.kind==="tech"?"of the techniques":it.kind==="eval"?"of the key ideas":"word accurate"}</div>
      ${html}${extra}
      <div class="model">${renderProse(it.text)}</div>
      <div class="gradebtns">
        <button class="btn ${sug===0?"suggest":""}" data-act="g" data-arg="0">Missed it</button>
        <button class="btn ${sug===1?"suggest":""}" data-act="g" data-arg="1">Almost</button>
        <button class="btn pri ${sug===2?"suggest":""}" data-act="g" data-arg="2">Got it</button>
      </div>
      <p class="lead" style="margin-top:9px;font-size:12.5px">Be honest — “Almost” brings it back in a few minutes, which is exactly what makes it stick.</p>
    </div>`);
  app.querySelector('[data-act="check"]').setAttribute("disabled","");
  const t=$("ans"); if(t) t.setAttribute("readonly","");
  bar.querySelector(".gradebtns").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function revealAns(){ const it=R.list[R.i]; srs(it.id).started=true;
  const bar=app.querySelector(".panel");

function doGrade(g){

}
function finishRun(){

function coach(){
  const due=dueNow(), nu=fresh(); const pick=[];
  const byS={}; due.forEach(i=>{ (byS[i.sec]=byS[i.sec]||[]).push(i); });
  const keys=Object.keys(byS); let n=0;                 /* interleave paragraphs */
  while(pick.length<10 && n<40){ keys.forEach(k=>{ if(byS[k].length&&pick.length<10) pick.push(byS[k].shift()); }); n++; }
  for(const i of nu){ if(pick.length>=12) break; pick.push(i); }

/* Drill picker */
const LAYERS=[{k:"all",n:"Everything"},{k:"quote",n:"Quotes only"},{k:"tech",n:"Techniques only"},

/* ═══ sort: technique → which quote ═════════════════════════════════════ */
let M=null;
const CARDS=[]; SECTIONS.forEach(s=>(s.cards||[]).forEach(c=>CARDS.push({c,sec:s})));
function techWords(c){ return words(c.tech.join(" ")).filter(w=>!STOP.has(w)&&w.length>3); }
function nearest(idx){
  const mine=new Set(techWords(CARDS[idx].c));
  return CARDS.map((x,i)=>({i, ov:i===idx?-1:techWords(x.c).filter(w=>mine.has(w)).length}))
    .sort((a,b)=>b.ov-a.ov); }
function match(){
  const pool=[]; CARDS.forEach((x,i)=>{ x.c.tech.forEach(t=>pool.push({i,q:t,type:"technique"}));
    x.c.evals.forEach(e=>pool.push({i,q:e,type:"evaluation"})); });
  M={pool:shuffle(pool).slice(0,12), i:0, right:0}; renderMatch();
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderMatch(){
  if(M.i>=M.pool.length){
    const pct=Math.round(M.right/M.pool.length*100);
    app.innerHTML=`<section class="panel"><div class="eyebrow">Sort</div>
      <h2>${pct}% placed correctly</h2>
      <p class="lead" style="margin-top:8px">${pct>=90?"You can tell the near-identical techniques apart. That is the difference between a quote you can use and a quote you can only recite."
        :"Every miss here is a mark lost on the day: the right technique welded to the wrong shot. Run it again."}</p>
      <div class="row" style="margin-top:14px"><button class="btn pri" data-act="match">Again</button>
      <button class="btn gh" data-act="home">Home</button></div></section>`;
    return; }
  M.locked=false;
  const q=M.pool[M.i], near=nearest(q.i);
  const opts=shuffle([q.i, near[0].i, near[1].i, near[2].i].filter((v,k,a)=>a.indexOf(v)===k).slice(0,4));
  app.innerHTML=`
  <div class="row" style="margin-bottom:12px"><button class="btn gh sm" data-act="home">← Leave</button>
    <span class="chip">Sort</span><span class="chip" style="margin-left:auto">${M.i+1} / ${M.pool.length}</span></div>
  <div class="progress"><i style="width:${Math.round(M.i/M.pool.length*100)}%"></i></div>
  <section class="panel">
    <div class="eyebrow">Which piece of evidence does this ${q.type} belong to?</div>
    <div class="cue"><div class="txt">${esc(q.q)}</div></div>
    <div class="opts" id="opts">
      ${opts.map(i=>`<button class="opt" data-act="mopt" data-arg="${i}|${q.i}">
        ${renderProse(shorten(CARDS[i].c.quote,90))}<small>${esc(CARDS[i].sec.short)}</small></button>`).join("")}
    </div>
  </section>`;
}
function matchPick(pick,right){
  if(M.locked) return; M.locked=true;
  const ok=pick===right; if(ok) M.right++;
  [...$("opts").children].forEach(b=>{ const v=+b.dataset.arg.split("|")[0];
    if(v===right) b.classList.add("y"); else if(v===pick) b.classList.add("n"); });
  const c=CARDS[right];
  $("opts").insertAdjacentHTML("afterend",
    `<div class="model" style="margin-top:14px"><b>${esc(c.sec.short)}</b> — ${c.c.tech.map(esc).join("; ")}</div>
     <div class="row" style="margin-top:13px"><button class="btn pri" data-act="mnext">${ok?"Next":"Got it — next"}</button></div>`);
}

/* ═══ blurt: build a whole paragraph ════════════════════════════════════ */
let B=null;
function blurt(sid){
  if(!sid){ app.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn gh sm" data-act="home">← Home</button></div>
    <section class="panel"><div class="eyebrow">Blurt</div><h2>Which paragraph?</h2>
    <p class="lead" style="margin-top:6px">You get the cues only. Write the paragraph as you would on the day, then check every component off.</p>
    <div class="row" style="margin-top:13px">${SECTIONS.map(s=>`<button class="btn" data-act="blurt" data-arg="${s.id}">${esc(s.short)}</button>`).join("")}</div></section>`;
    return; }
  const s=secOf(sid); B={sid};
  const cues = s.cards? s.cards.map((c,i)=>`<li>${esc(c.cue)}${c.who?` <span style="color:var(--mut)">— ${esc(c.who)}</span>`:""}</li>`).join("")
    : s.lines.map(l=>`<li>${esc(l.label)}</li>`).join("");
  app.innerHTML=`
  <div class="row" style="margin-bottom:12px"><button class="btn gh sm" data-act="blurt">← Paragraphs</button>
    <span class="chip">Blurt</span></div>
  <section class="panel">
    <div class="eyebrow">${esc(s.name)}</div>
    <h2>Write it from these cues alone</h2>
    <ul class="tight">${cues}${s.cards?"<li>Turn, then Close</li>":""}</ul>
    <textarea class="field" id="bl" rows="12" style="margin-top:14px" placeholder="Shell sentence, context, then quote → technique → evaluation, three times, then the Turn and the Close…" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" data-act="blcheck">Check every component</button></div>
  </section>`;
  $("bl").focus();
}
function componentsOf(sid){
  const s=secOf(sid), out=[];
  if(s.lines){ s.lines.forEach(l=>out.push({n:l.label, t:clean(l.text), w:.34})); return out; }
  out.push({n:"Shell sentence", t:clean(s.shell.text), w:.5});
  out.push({n:"Context sentence", t:clean(s.context.text), w:.5});
  s.cards.forEach((c,i)=>{
    out.push({n:(c.scene?"Scene ":"Quote ")+(i+1), t:clean(c.quote), w:1});
    c.tech.forEach(t=>out.push({n:"Technique — "+t, t:t, w:.7}));
    c.evals.forEach((e,j)=>out.push({n:"Evaluation "+(i+1)+"."+(j+1), t:e, w:.8}));
  });
  out.push({n:"Turn", t:clean(s.turn.text), w:1});
  out.push({n:"Close", t:clean(s.close.text), w:1});
  return out;
}
function blurtCheck(){
  const typed=$("bl").value.trim();
  if(!typed) return toast("Write something first");
  const comps=componentsOf(B.sid).map(c=>Object.assign(c,{y:hasPhrase(typed,c.t)}));
  const got=comps.filter(c=>c.y).reduce((a,c)=>a+c.w,0), tot=comps.reduce((a,c)=>a+c.w,0);
  const pct=Math.round(got/tot*100), n=words(typed).length;

  if(n>=90) comps.filter(c=>!c.y).forEach(c=>{ const it=ITEMS.find(i=>clean(i.text)===c.t || i.text===c.t);
    if(it){ const r=srs(it.id); if(r.started){ r.lapses++; r.reps=Math.max(0,r.reps-1); r.due=Date.now(); } } });
  save(); bumpStreak(); chrome();

    <div class="checks" style="margin-top:14px">
      ${comps.map(c=>`<div class="check ${c.y?"y":"n"}"><b>${c.y?"✓":"✗"}</b><span>${esc(c.n)}${c.y?"":" — <i>"+esc(shorten(c.t,80))+"</i>"}</span></div>`).join("")}
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn pri" data-act="drillsec" data-arg="${B.sid}">Drill what I missed</button>
      <button class="btn gh" data-act="blurt" data-arg="${B.sid}">Again</button>
      <button class="btn gh" data-act="study" data-arg="${B.sid}">Read it</button>
    </div></section>`);
  app.lastElementChild.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ═══ adapt: the red clauses vs a real question ═════════════════════════ */

function examMark(){

    return {s, pct:Math.round(got/tot*100), comps};
  });
  const overallPct=Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length);

  save(); bumpStreak(); chrome();
  app.innerHTML=`<section class="panel">

      <div class="tile"><b>${mins}</b><small>minutes</small></div>

    <p class="lead" style="margin-top:14px">${n<700?"Under 700 words is thin for 20 marks — most of the gap is evidence you didn’t reach."
      :mins>42?"Over time. The shell exists so you don’t have to compose under pressure; the fix is recall speed, not writing faster."
      :"Length and timing are where they need to be."}</p>
  </section>
  ${rows.map(r=>`<section class="panel">
    <div class="row" style="margin-bottom:10px"><span class="chip">${esc(r.s.short)}</span>
      <span class="chip ${r.pct>=80?"seam":r.pct>=50?"lampc":"sig"}" style="margin-left:auto">${r.pct}%</span></div>
    <div class="checks">${r.comps.map(c=>`<div class="check ${c.y?"y":"n"}"><b>${c.y?"✓":"✗"}</b><span>${esc(c.n)}</span></div>`).join("")}</div>
  </section>`).join("")}
  <div class="row"><button class="btn pri" data-act="coach">Drill the gaps</button>
    <button class="btn gh" data-act="exam">Sit another</button>
    <button class="btn gh" data-act="home">Home</button></div>`;
  scrollTo({top:0,behavior:"smooth"});
}

/* ═══ the method ════════════════════════════════════════════════════════ */
function plan(){
  S.seenPlan=true; save();
  app.innerHTML=`
  <div class="row" style="margin-bottom:14px"><button class="btn gh sm" data-act="home">← Home</button></div>
  <section class="panel">
    <div class="eyebrow">The analysis</div>
    <h2>What to memorise, and how hard</h2>
    <p class="lead" style="margin-top:7px">There are ${ITEMS.length} things to hold here, and they are not all the same kind of thing. Treating them the same is the usual reason a shell essay falls apart in the room.</p>
    <div class="scroll"><table class="plan" style="margin-top:14px">
      <tr><th>Layer</th><th>How much</th><th>Why</th></tr>
      <tr><td><b>The ${ITEMS.filter(i=>i.kind==="quote").length} quotes and scenes</b></td><td>Word for word, no licence</td>
        <td>A misquoted line stops being evidence. Two of the nine are scenes, not dialogue — you need the shot, not a sentence.</td></tr>
      <tr><td><b>The ${ITEMS.filter(i=>i.kind==="tech").length} technique sets</b></td><td>Exact names, any order</td>
        <td>Marks come from naming the technique, not describing it. “Axial jump cuts”, “non-diegetic”, “tricolon” — the precise term or nothing.</td></tr>
      <tr><td><b>The ${ITEMS.filter(i=>i.kind==="eval").length} evaluation clauses</b></td><td>Near-verbatim; keep the idea and the verb</td>
        <td>These are clauses, not sentences. You join two with <i>so</i>, <i>and</i> or a colon on the day, so the phrasing has to bend.</td></tr>
      <tr><td><b>Turns and Closes</b></td><td>Word for word</td>
        <td>The only six sentences that <i>assess</i> rather than describe. This is the band 6 line, and they are short — cheapest marks in the essay.</td></tr>
      <tr><td><b>Shell and context sentences</b></td><td>Word for word around the red</td>
        <td>The frame carries the argument; the bracket carries the question.</td></tr>
      <tr><td><b>The ${REDS.length} red clauses</b></td><td><b>Do not memorise</b></td>
        <td>Rehearse rewriting them instead. A red clause you have memorised is a question you have ignored.</td></tr>
    </table></div>
  </section>

  <section class="panel">
    <div class="eyebrow">Four traps</div>
    <h2>Where this essay will trip you</h2>
    <p class="lead" style="margin-top:6px">These are not general study tips — they come from what actually repeats inside your nine pieces of evidence.</p>
    <ul class="tight" style="margin-top:11px">
      <li><b>Shot/reverse shot appears twice.</b> Body 1 with Jackie’s “Lads do football…”, Body 2 with “Just because I like ballet…”. Different jobs: in Body 1 the cutting <i>denies a shared frame</i>; in Body 2 it <i>puts the cost on Michael’s face</i>. Learn them as a contrast or you will attach the wrong effect.</li>
      <li><b>The cage appears three times.</b> Gym cage in Body 1 (Jackie behind the wire, the enforcer imprisoned), gym cage again in Body 2 (the dance of defiance shot through it), pit cage in Body 3 (descending as Billy leaves). It is the spine of the essay — memorise the trio together and you get three quotes for the price of one image.</li>
      <li><b>Diegetic or not.</b> Body 2’s crescendo is <i>non-diegetic</i>; Body 3’s crowd and Swan Lake score are <i>diegetic</i>. One wrong prefix and the marker knows you learnt a word rather than a shot.</li>
      <li><b>High angle down, low angle up.</b> Body 3 runs both: the high angle diminishes Jackie at the pit gates, the low angle elevates Billy in the leap. Daldry paired them on purpose, so learn them paired.</li>
    </ul>
  </section>

  <section class="panel">
    <div class="eyebrow">The spine</div>
    <h2>One shape, three times</h2>
    <p class="note">Every body paragraph runs the same six beats: <b>shell claim → context (Daldry and the 1980s) → three times [quote → technique → two evaluations] → Turn → Close</b>. Learn the shape once and you only ever recall the fillings.</p>
    <p class="note">All three Turns open with <b>“Yet”</b> and each names its own cost: Body 1 <b>defeat</b>, Body 2 <b>purity</b>, Body 3 <b>purchase</b>. Two of the three Closes open “Daldry positions audiences to…” — recognise, then value; Body 3 buries the phrase mid-sentence, which is the one that catches people.</p>
    <p class="note">Jackie carries three of the nine pieces of evidence, in order: enforcer (“Not friggin’ ballet”) → defeated (“I never made it past Durham”) → faith-breaker (“Give the boy a chance”). If you lose your thread on the day, walk Jackie’s arc and the evidence comes back with it.</p>
  </section>

  <section class="panel">
    <div class="eyebrow">The order</div>
    <h2>Learn it in this sequence</h2>
    <ol class="tight">
      <li><b>Introduction first</b> — its three green phrases <i>are</i> the three body paragraphs. Learning it first gives you a hook to hang everything else on.</li>
      <li><b>Quote, then technique, then evaluation</b>, one card at a time. The quote is the retrieval cue for the other two, so it has to be solid first.</li>
      <li><b>Turn and Close last in each paragraph</b>, once the evidence beneath them means something.</li>
      <li><b>Then stop going paragraph by paragraph.</b> Mixing them up feels worse and works better — that mixing is exactly what stops Body 2’s techniques leaking into Body 1.</li>
    </ol>
    <p class="note" style="margin-top:12px">Sessions beat hours. Four twenty-minute sessions across two days will beat one long night, and sleeping between them is doing real work, not lost time. Say every new line out loud at least once — spoken lines are remembered better than read ones, and it costs nothing.</p>
    <p class="note">A line only counts as learnt here after <b>three correct recalls spread over separate sittings</b>. That is the one number in this app worth trusting: relearning to a criterion, spaced, is what makes it survive to the exam rather than to tonight.</p>
  </section>

  <section class="panel">
    <div class="eyebrow">Where the research comes from</div>
    <ul class="tight">
      <li>Recall to a criterion across spaced sessions — Rawson &amp; Dunlosky, <i>Successive Relearning</i>, Current Directions in Psychological Science (2022).</li>
      <li>Testing beats rereading on delayed tests — Roediger &amp; Karpicke, <i>Test-Enhanced Learning</i>, Psychological Science (2006).</li>
      <li>Spaced gaps beat massed study — Cepeda, Vul, Rohrer, Wixted &amp; Pashler, Psychological Science (2008).</li>
      <li>Read–recite–review beats rereading — McDaniel, Howard &amp; Einstein, Psychological Science (2009).</li>
      <li>Failed retrieval still helps, if feedback follows — Kornell, Hays &amp; Bjork, JEP:LMC (2009).</li>
      <li>Saying it aloud beats reading it silently — the production effect, MacLeod and colleagues.</li>
    </ul>
  </section>
  <div class="row"><button class="btn pri" data-act="coach">Start a session</button>
  <button class="btn gh" data-act="home">Home</button></div>`;
}

const ACTS={
  home, study:a=>study(a), speak:a=>speak(a), plan,
  coach, drill:a=>drill(a), drillsec:a=>drill(a), drillgo:a=>{const[s,l]=a.split("|");drill(s,l);},
  weak:()=>startRunner(weak().slice(0,16),"Weak lines"),
  match, mopt:a=>{const[p,r]=a.split("|");matchPick(+p,+r);}, mnext:()=>{M.locked=false;M.i++;renderMatch();},
  letters:a=>letters(a), flall:()=>{ [...document.querySelectorAll("#flbox .w")].forEach(w=>{w.textContent=w.dataset.full;w.classList.add("shown");}); },
  flw:a=>{ const w=document.querySelector('#flbox .w[data-arg="'+a+'"]'); if(w){w.textContent=w.dataset.full;w.classList.add("shown");} },
  flnext:g=>{ const it=F.list[F.i]; const shown=document.querySelectorAll("#flbox .w.shown").length;
    grade(it.id, (+g===2&&shown===0)?2:(shown<3?1:0)); F.i++; chrome(); renderFL(); },
  blurt:a=>blurt(a), blcheck:blurtCheck,
  adapt:a=>adapt(a===undefined?null:a), adsave:adaptSave,
  exam:a=>exam(a===""||a===undefined?null:a), exmark:examMark,
  hide:hidePeek, check:checkAns, reveal:revealAns, g:a=>doGrade(+a),
  theme:flipTheme
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const fn=ACTS[t.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(t.dataset.arg);
});
document.addEventListener("keydown",e=>{
  if(!R||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.key==="Enter"&&R.phase==="mark"){ const b=app.querySelector(".gradebtns .suggest"); if(b) b.click(); }
});
home();
