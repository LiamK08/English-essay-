<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1020" />
<title>Essay Memoriser — Curious Incident (Module B)</title>
<style>
  :root{
    --bg:#0f1020; --bg2:#171830; --card:#1c1d3a; --card2:#23254a;
    --ink:#eef0ff; --muted:#9aa0c7; --line:#2c2e58;
    --accent:#7c5cff; --accent2:#22d3ee; --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --ring-bg:#2a2c55;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%, #232450 0%, var(--bg) 55%) fixed;
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .wrap{max-width:960px;margin:0 auto;padding:14px 16px 80px}
  a{color:var(--accent2)}
  button{font-family:inherit}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);
    padding:10px 16px;border-radius:12px;font-size:15px;cursor:pointer;font-weight:600;
    transition:transform .08s ease, background .15s, border-color .15s; user-select:none;
  }
  .btn:hover{background:#2c2e63;border-color:#3a3d7a}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#9a7bff);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.good{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#04231a}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}

  /* Header */
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .brand h1{font-size:16px;margin:0;line-height:1.15}
  .brand p{margin:0;font-size:12px;color:var(--muted)}
  .hstats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lvl{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 12px}
  .lvl .num{font-weight:800}
  .xpbar{width:120px;height:9px;border-radius:999px;background:var(--ring-bg);overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%}
  .icbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;padding:0}

  /* Hero */
  .hero{background:linear-gradient(135deg,#20224a,#181a36);border:1px solid var(--line);border-radius:18px;padding:18px 18px;box-shadow:var(--shadow);margin-bottom:18px}
  .hero h2{margin:0 0 4px;font-size:20px}
  .hero p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .path{display:flex;gap:8px;flex-wrap:wrap}
  .step{font-size:12.5px;color:var(--ink);background:#262853;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
  .step b{color:var(--accent2)}

  /* Section grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative;transition:transform .1s, border-color .15s, background .15s;display:flex;flex-direction:column;gap:10px}
  .scard:hover{transform:translateY(-2px);border-color:#41459a;background:var(--card2)}
  .scard.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,92,255,.35)}
  .scard .ico{font-size:26px}
  .scard h3{margin:0;font-size:15px}
  .scard .meta{font-size:11.5px;color:var(--muted)}
  .ring{--p:0;width:46px;height:46px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--ring-bg) 0);
    display:grid;place-items:center;position:absolute;top:12px;right:12px}
  .ring::after{content:attr(data-label);width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--ink)}

  /* Panel */
  #panel{margin-top:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:9px}
  .panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .modes{display:flex;flex-direction:column;gap:12px}
  .moderow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .moderow .label{font-weight:700;min-width:128px;display:flex;align-items:center;gap:8px}
  .moderow .desc{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:-2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--ink);padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:#2c2e63}

  /* Play view */
  .play{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .playhead .title{font-weight:800;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .playhead .title .tag{font-size:11px;color:var(--muted);font-weight:600;background:var(--bg2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .statline{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
  .stat small{color:var(--muted);font-weight:600}

  .passage{font-size:18px;line-height:2.05;letter-spacing:.1px}
  .passage.read{font-size:19px;line-height:1.95}
  .adapt{color:var(--accent2);border-bottom:2px dotted var(--accent2);padding:0 2px;font-style:italic}
  .qte{color:#ffd9a8}

  /* Cloze */
  input.blank{
    background:#0e0f22;border:0;border-bottom:2px solid var(--accent);color:var(--ink);
    font:inherit;font-weight:700;text-align:center;padding:2px 4px;margin:0 1px;border-radius:6px 6px 0 0;
    outline:none;min-width:34px;transition:background .15s,border-color .15s;
  }
  input.blank:focus{background:#181a3a}
  input.blank.ok{color:var(--good);border-color:var(--good);background:rgba(52,211,153,.08)}
  input.blank.bad{color:var(--bad);border-color:var(--bad);background:rgba(251,113,133,.08)}
  input.blank.reveal{color:var(--warn);border-color:var(--warn)}

  /* word spans (type/first) */
  .w{padding:0 1px;border-radius:5px}
  .w.correct{color:var(--good)}
  .w.wrong{color:var(--bad);text-decoration:underline wavy var(--bad)}
  .w.hint{color:var(--muted);opacity:.55}
  .w.up{color:var(--muted);opacity:.4;letter-spacing:1px}
  .w.cur{background:rgba(124,92,255,.28);box-shadow:0 0 0 2px rgba(124,92,255,.5);border-radius:6px;color:#fff;font-weight:700}
  .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent2);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* First letters */
  .fl .w{cursor:pointer;color:var(--muted);transition:color .12s}
  .fl .w:hover{color:var(--ink)}
  .fl .w.shown{color:var(--good);font-weight:600;cursor:default}

  /* Type input */
  .typebar{position:sticky;bottom:0;margin-top:16px;display:flex;gap:10px;align-items:center;background:var(--card);padding-top:10px}
  #typein{flex:1;background:#0e0f22;border:2px solid var(--accent);border-radius:13px;color:var(--ink);font-size:18px;font-weight:600;padding:13px 15px;outline:none}
  #typein::placeholder{color:#6b71a3;font-weight:500}

  /* Unscramble */
  .tiles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .answerbox{min-height:54px;background:#0e0f22;border:1px dashed var(--line);border-radius:13px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;user-select:none;transition:transform .07s}
  .tile:hover{background:#2c2e63}
  .tile:active{transform:scale(.96)}
  .tile.ok{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good)}
  .tile.bad{background:rgba(251,113,133,.16);border-color:var(--bad);color:var(--bad)}
  .tile.ph{visibility:hidden}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  .hidden{display:none!important}

  /* Result */
  .result{text-align:center;padding:18px 6px}
  .result .big{font-size:54px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .result .kv{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px}
  .result .kv b{display:block;font-size:22px}
  .result .kv small{color:var(--muted)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:13px;font-weight:700;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  .combo{position:fixed;right:18px;bottom:80px;font-weight:900;font-size:15px;color:var(--warn);opacity:0;transition:.2s;z-index:40}
  .combo.show{opacity:1}

  footer.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  @media(max-width:560px){
    .passage{font-size:17px;line-height:1.95}
    .moderow .label{min-width:0}
    .xpbar{width:84px}
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">📖</div>
      <div>
        <h1>Essay Memoriser</h1>
        <p>The Curious Incident of the Dog in the Night-Time · Module B</p>
      </div>
    </div>
    <div class="hstats">
      <div class="lvl" title="Your level &amp; XP">
        <span>Lv <span class="num" id="lvlNum">1</span></span>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <span class="pill" id="streakPill" title="Daily streak">🔥 <span id="streakNum">0</span></span>
      <button class="btn icbtn ghost" id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </header>

  <div id="home"></div>
  <div id="panel"></div>
  <div id="view"></div>
</div>

<div id="toast"></div>
<div class="combo" id="comboTag"></div>

<script>
/* ============================================================
   ESSAY DATA  (Quote Bank intentionally excluded)
   [square brackets] = the adaptable hook / concept phrase
   ============================================================ */
const SECTIONS = [
  { id:"intro", name:"Introduction", short:"Intro", icon:"🎯",
    text:`[Enduring literature foregrounds ideas inseparable from the form that enacts them, demonstrating how a text’s distinctive qualities become the very means by which it generates meaning.] Situated within a post-9/11 society marked by eroded public trust and a growing cultural awareness of neurodiversity, Mark Haddon’s novel The Curious Incident of the Dog in the Night-Time (2003) constructs a distinctive first-person narrative voice, defined by Christopher Boone’s literal cognition, to destabilise conventional notions of normality, truth and human connection. Through a hybrid form and distinctive narrative elements, Haddon filters the entire world through Christopher’s logical mind, revealing that his perception, his pursuit of truth and his hard-won agency are capabilities realised not despite his difference but through it, and challenging how we define [normality and ability].` },
  { id:"bp1", name:"Body 1 · Perception", short:"Perception", icon:"🧠",
    text:`A mind that orders the world through logic and pattern rather than emotion perceives not in a lesser way but in a different one, exposing how narrowly society defines normality. Haddon embeds this difference in the novel’s structure, numbering its chapters with prime numbers so that the form itself enacts Christopher’s logical cognition. The recurring mathematical motif becomes a worldview through the simile ‘prime numbers are like life,’ which captures Christopher finding meaning in structure rather than sentiment. His intelligence is conveyed through accumulation, his self-introduction listing the world’s capitals and ‘every prime number up to 7,057,’ so that information becomes the substance of his identity. Yet the same mind that masters facts finds people opaque, and the simple declarative ‘I find people confusing’ enacts the literalism it describes, reducing the ambiguity of social life to a flat statement that signals not stupidity but a different ordering of priorities. Through this convergence of structure, motif and language, Haddon positions such perception as valid and capable, unsettling the assumption that to think differently is to think less.` },
  { id:"bp2", name:"Body 2 · Truth", short:"Truth", icon:"⚖️",
    text:`Even well-intentioned deception corrodes the trust on which relationships depend, exposing honesty as the fragile but indispensable foundation of human connection. Haddon establishes truth as the bedrock of his protagonist through the declarative ‘I do not tell lies,’ a flat statement of character that leaves Christopher acutely vulnerable to a world that lies with ease. This vulnerability is sharpened by dramatic irony when Christopher reasons that his father ‘always tells me the truth, which means that he loves me’; the reader, who knows that Ed has invented the death of Christopher’s mother, recognises the trust as tragically misplaced, so that the equation of truth with love becomes the fault line along which the relationship breaks. That break is delivered through the epistolary form, as the discovery of his mother’s hidden letters exposes the deception and the plain declarative ‘Father had lied about this’ registers the totality of the betrayal. Crucially, Haddon refuses easy reconciliation, rebuilding trust only through honesty, as the emphatic repetition of Ed’s promise that he ‘would never, ever do anything to hurt’ him restores their bond on truthful terms. In doing so, the novel affirms that a genuine relationship can rest on nothing less than truth.` },
  { id:"bp3", name:"Body 3 · Agency", short:"Agency", icon:"🚀",
    text:`Genuine agency is measured not by conformity to a norm but by the courage to act through fear and the capability to author one’s own future. Christopher’s solo journey to London dramatises this, the visceral imagery of a station that leaves him ‘giddy and sick’ conveying the sensory ordeal he must overcome. Yet Haddon portrays him problem-solving rather than retreating, as the recurring motif of order returns and he narrows the chaos to ‘one sign at a time,’ turning his need for system into a tool for survival so that his agency lies in the very cognition the world has misread as a limitation. That capability hardens into ambition through the future tense of ‘I will become a scientist,’ which projects a self that has outgrown its earlier confinement. Haddon consolidates the transformation in the novel’s triumphant final cadence, where the high modality of ‘I can do anything,’ reinforced by the repetition of the first-person pronoun, converts a list of obstacles overcome into a declaration of selfhood. In closing on this assertion, Haddon redefines growth itself, inviting the reader to measure ability not against a narrow norm but against the courage and competence Christopher has proven to be entirely his own.` },
  { id:"concl", name:"Conclusion", short:"Conclusion", icon:"🏁",
    text:`Across the novel, Haddon moves Christopher from a precise but isolating perception, through the rupture and repair of trust, to the agency of his journey and the future he claims beyond it. Because this growth is rendered through the form and language of Christopher’s own mind, the novel insists that his perception, his integrity and his capability are not achievements made despite his difference but expressions of it. In doing so, The Curious Incident of the Dog in the Night-Time asks its reader to abandon a narrow measure of [normality and ability], and to recognise that understanding, courage and selfhood can be reached by more paths than one.` },
];
const WHOLE = { id:"whole", name:"Whole Essay", short:"Whole", icon:"👑",
  text: SECTIONS.map(s=>s.text).join("\n\n") };
const ALL = SECTIONS.concat([WHOLE]);
function getSection(id){ return ALL.find(s=>s.id===id); }

/* ============================================================
   STATE  +  PERSISTENCE
   ============================================================ */
const SAVE_KEY = "essayMemoriser.v1";
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && typeof s==="object") return Object.assign(defaults(), s);
  }catch(e){}
  return defaults();
}
function defaults(){ return { xp:0, muted:false, best:{}, streak:{count:0,last:null} }; }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function bestOf(id){ return state.best[id] || (state.best[id]={cloze:0,type:0,first:0,order:0}); }
function recordBest(id,mode,pct){ const b=bestOf(id); if(pct>(b[mode]||0)){ b[mode]=Math.round(pct); save(); return true;} return false; }
function mastery(id){
  const b = state.best[id]; if(!b) return 0;
  return Math.round(Math.max(b.type||0, (b.cloze||0)*0.9, (b.first||0)*0.7, (b.order||0)*0.8));
}

/* Level maths */
function levelFor(xp){ return Math.floor(Math.sqrt(xp/25)); }
function xpForLevel(L){ return 25*L*L; }
function refreshHeader(){
  const L = levelFor(state.xp);
  const cur = xpForLevel(L), next = xpForLevel(L+1);
  const pct = next>cur ? ((state.xp-cur)/(next-cur))*100 : 100;
  document.getElementById("lvlNum").textContent = L+1;
  document.getElementById("xpFill").style.width = pct+"%";
  document.getElementById("streakNum").textContent = state.streak.count||0;
  document.getElementById("muteBtn").textContent = state.muted ? "🔇" : "🔊";
}
function addXP(n){
  const before = levelFor(state.xp);
  state.xp += n; save();
  const after = levelFor(state.xp);
  refreshHeader();
  if(after>before){ toast("⭐ Level up! You reached Level "+(after+1)); burst(); }
}
function bumpStreak(){
  const t = todayStr();
  const s = state.streak;
  if(s.last===t) return;
  const y = new Date(Date.now()-864e5); const ys = dstr(y);
  s.count = (s.last===ys) ? (s.count||0)+1 : 1;
  s.last = t; save(); refreshHeader();
}
function todayStr(){ return dstr(new Date()); }
function dstr(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* ============================================================
   TEXT TOOLS
   ============================================================ */
function stripBrackets(t){ return t.replace(/[\[\]]/g,""); }
// loose comparison: ignore case, punctuation, smart quotes, commas in numbers
function loose(w){ return (w||"").toLowerCase().replace(/[’‘`']/g,"").replace(/[^a-z0-9]/g,""); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// tokenize into words + separators (brackets removed)
const WORD_RE = /[A-Za-z0-9]+(?:['’\-\/,][A-Za-z0-9]+)*/g;
function tokenize(text){
  text = stripBrackets(text);
  const toks=[]; let last=0,m;
  WORD_RE.lastIndex=0;
  while((m=WORD_RE.exec(text))){
    if(m.index>last) toks.push({t:"sep",x:text.slice(last,m.index)});
    toks.push({t:"w",x:m[0],c:loose(m[0])});
    last=m.index+m[0].length;
  }
  if(last<text.length) toks.push({t:"sep",x:text.slice(last)});
  return toks;
}
function words(text){ return tokenize(text).filter(t=>t.t==="w"); }
function wordCount(text){ return words(text).length; }

// study HTML: highlight [adaptable] and 'quotes'
function studyHTML(text){
  let out=""; let i=0;
  const re=/\[([^\]]*)\]/g; let m; let last=0;
  while((m=re.exec(text))){
    out += quoteHL(text.slice(last,m.index));
    out += '<span class="adapt">'+quoteHL(m[1])+'</span>';
    last = m.index+m[0].length;
  }
  out += quoteHL(text.slice(last));
  return out;
}
function quoteHL(t){
  t = esc(t);
  return t.replace(/(‘[^’]*’)/g,'<span class="qte">$1</span>');
}
// sentences (brackets stripped) for unscramble
function sentences(text){
  text = stripBrackets(text).replace(/\s+/g," ").trim();
  return text.replace(/([.;!?]['’”"]?)\s+/g,"$1").split("").map(s=>s.trim()).filter(Boolean);
}

/* ============================================================
   SOUND  (tiny WebAudio blips)
   ============================================================ */
let actx=null;
function beep(freq,dur,type,vol){
  if(state.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+(dur||0.12));
    o.stop(actx.currentTime+(dur||0.12));
  }catch(e){}
}
const sfx={
  ok(){ beep(660,0.09,"triangle",0.05); },
  great(){ beep(880,0.08,"triangle",0.05); setTimeout(()=>beep(1320,0.1,"triangle",0.05),70); },
  no(){ beep(150,0.16,"sawtooth",0.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.13,"triangle",0.06),i*110)); }
};

/* ============================================================
   UI HELPERS
   ============================================================ */
const $ = id=>document.getElementById(id);
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900);
}
function showCombo(n){
  const c=$("comboTag");
  if(n>=3){ c.textContent="🔥 "+n+" combo"; c.classList.add("show"); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),900); }
  else c.classList.remove("show");
}

/* Confetti */
function burst(){
  const cv=$("confetti"); const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#7c5cff","#22d3ee","#34d399","#fbbf24","#fb7185","#fff"];
  const P=[];
  for(let i=0;i<140;i++) P.push({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.35,
    vx:(Math.random()-.5)*9, vy:Math.random()*-11-4, g:0.32+Math.random()*0.15,
    s:6+Math.random()*7, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*0.4});
  let frames=0;
  (function run(){
    ctx.clearRect(0,0,cv.width,cv.height); frames++;
    P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.55); ctx.restore(); });
    if(frames<130) requestAnimationFrame(run); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ============================================================
   MODE: FILL THE GAPS (CLOZE)
   ============================================================ */
let C=null;
function pickBlanks(ws,diff){
  const N=ws.length;
  if(diff>=1) return new Set(ws.map((_,i)=>i));
  const stop=new Set("the a an of to and in on that as is are was his her its it he we by but not this for with at from which who".split(" "));
  const scored=ws.map((w,i)=>({i, s:(stop.has(w.c)?0:1.2)+Math.random()}));
  scored.sort((a,b)=>b.s-a.s);
  const k=Math.max(1,Math.round(diff*N));
  return new Set(scored.slice(0,k).map(o=>o.i));
}
function modeCloze(id,diff){
  const s=getSection(id);
  const toks=tokenize(s.text);
  const ws=toks.filter(t=>t.t==="w");
  const blanks=pickBlanks(ws,diff);
  C={toks,ws,blanks,diff,checked:false,total:blanks.size};
  let wi=-1, html="";
  toks.forEach(t=>{
    if(t.t==="sep"){ html+=esc(t.x); return; }
    wi++;
    if(blanks.has(wi)){
      const len=t.x.length;
      html+=`<input class="blank" data-i="${wi}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(34,len*11+12)}px" aria-label="blank">`;
    } else html+=`<span class="w">${esc(t.x)}</span>`;
  });
  const dn=({0.2:"Easy",0.4:"Medium",0.6:"Hard",1:"Expert"})[diff]||"";
  const body=`
    <div class="passage">${html}</div>
    <div class="actions">
      <button class="btn" id="hintBtn">💡 First letters</button>
      <button class="btn primary" id="checkBtn">✓ Check answers</button>
      <button class="btn" id="revealBtn">👁 Reveal</button>
    </div>
    <div class="note" id="clozeNote">Tip: correct words turn green and jump you to the next blank.</div>`;
  $("view").innerHTML=playShell(s,"Fill the Gaps · "+dn,dn,body);
  // attach
  const inputs=[...$("modebody").querySelectorAll("input.blank")];
  C.inputs=inputs;
  updateClozeStat();
  inputs.forEach((inp,idx)=>{
    inp.addEventListener("input",()=>{
      const wi=+inp.dataset.i; const target=ws[wi];
      inp.classList.remove("bad","reveal");
      if(loose(inp.value)===target.c && inp.value.trim()!==""){
        if(!inp.classList.contains("ok")){ inp.classList.add("ok"); sfx.ok(); }
        const nxt=inputs[idx+1]; if(nxt && !nxt.classList.contains("ok")) nxt.focus();
        updateClozeStat();
      } else { inp.classList.remove("ok"); updateClozeStat(); }
    });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); (inputs[idx+1]||$("checkBtn")).focus(); }});
  });
  if(inputs[0]) inputs[0].focus();
  $("hintBtn").onclick=()=>{ inputs.forEach(inp=>{ if(!inp.classList.contains("ok")){ const wi=+inp.dataset.i; inp.placeholder=ws[wi].x[0]+"…"; } }); toast("First letters added as hints"); };
  $("revealBtn").onclick=()=>clozeReveal();
  $("checkBtn").onclick=()=>clozeCheck();
}
function updateClozeStat(){
  const okN=C.inputs.filter(i=>i.classList.contains("ok")).length;
  $("statline").innerHTML=`<span class="stat" style="color:var(--good)">${okN}<small>/${C.total} correct</small></span>`;
}
function clozeReveal(){
  C.inputs.forEach(inp=>{ const wi=+inp.dataset.i; if(!inp.classList.contains("ok")){ inp.value=C.ws[wi].x; inp.classList.add("reveal"); inp.classList.remove("bad"); } });
  toast("Answers revealed — now try again from memory");
}
function clozeCheck(){
  let ok=0;
  C.inputs.forEach(inp=>{ const wi=+inp.dataset.i;
    if(loose(inp.value)===C.ws[wi].c && inp.value.trim()!==""){ inp.classList.add("ok"); inp.classList.remove("bad"); ok++; }
    else { inp.classList.add("bad"); inp.classList.remove("ok"); }
  });
  const pct=C.total? Math.round(ok/C.total*100):100;
  const xp=Math.round(pct*0.5*(0.6+C.diff));
  addXP(xp); bumpStreak();
  const isBest=recordBest(C.section_id||currentSectionId,"cloze",pct);
  if(pct>=90){ sfx.win(); burst(); } else if(pct>=60) sfx.ok(); else sfx.no();
  const note=$("clozeNote");
  note.innerHTML=`<b style="color:${pct>=80?'var(--good)':pct>=50?'var(--warn)':'var(--bad)'}">${ok}/${C.total} correct · ${pct}%</b> · +${xp} XP${isBest?" · 🏅 new best!":""} — red ones are wrong; fix them or hit Reveal.`;
  updateClozeStat();
}

let T=null;
function modeType(id){
  const s=getSection(id);
  const toks=tokenize(s.text);
  const ws=toks.filter(t=>t.t==="w");
  T={toks,ws,cur:0,status:[],buffer:"",correct:0,combo:0,maxCombo:0,start:0,hint:"first"};
  const body=`
    <div class="passage" id="typepass"></div>
    <div class="typebar">
      <input id="typein" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the highlighted word, then space…">
      <button class="btn sm" id="hintCycle" title="Cycle hint level">Hint: first letters</button>
      <button class="btn sm" id="skipWord" title="Reveal this word">💡</button>
    </div>
    <div class="note">Type each word then press <b>space</b>. Correct → green. Cycle the hint button down to <b>none</b> once you're confident.</div>`;
  $("view").innerHTML=playShell(s,"Type It Out","boss",body);
  renderType(); updateTypeStat();
  const inp=$("typein");
  inp.addEventListener("keydown",e=>{
    if(e.key===" " || e.key==="Enter"){ e.preventDefault(); typeCommit(inp.value); inp.value=""; T.buffer=""; }
  });
  inp.addEventListener("input",()=>{ T.buffer=inp.value; const c=$("curword"); if(c) c.innerHTML=esc(T.buffer)+'<span class="caret"></span>'; });
  $("hintCycle").onclick=()=>{
    T.hint = T.hint==="full"?"first": T.hint==="first"?"none":"full";
    $("hintCycle").textContent="Hint: "+(T.hint==="full"?"full words":T.hint==="first"?"first letters":"none");
    renderType();
  };
  $("skipWord").onclick=()=>{ typeCommit(T.ws[T.cur]?T.ws[T.cur].x:"", true); $("typein").value=""; T.buffer=""; };
  setTimeout(()=>inp.focus(),60);
}
function hintFor(tok){
  if(T.hint==="full") return '<span class="w hint">'+esc(tok.x)+'</span>';
  if(T.hint==="first") return '<span class="w up">'+esc(tok.x[0])+'·'.repeat(Math.max(0,tok.x.length-1))+'</span>';
  return '<span class="w up">'+'·'.repeat(tok.x.length)+'</span>';
}
function renderType(){
  let wi=-1, html="";
  T.toks.forEach(t=>{
    if(t.t==="sep"){ html+=esc(t.x); return; }
    wi++;
    if(wi<T.cur){ html+='<span class="w '+(T.status[wi]||"correct")+'">'+esc(t.x)+'</span>'; }
    else if(wi===T.cur){ html+='<span class="w cur" id="curword">'+(T.buffer?esc(T.buffer):'')+'<span class="caret"></span></span>'; }
    else html+=hintFor(t);
  });
  $("typepass").innerHTML=html;
  const c=$("curword"); if(c) c.scrollIntoView({block:"nearest"});
}
function typeCommit(raw,forced){
  raw=(raw||"").trim();
  if(!forced && raw==="") return;
  if(T.start===0) T.start=Date.now();
  const tok=T.ws[T.cur]; if(!tok) return;
  const ok = !forced && loose(raw)===tok.c;
  T.status[T.cur]= forced?"wrong": (ok?"correct":"wrong");
  if(ok){ T.correct++; T.combo++; T.maxCombo=Math.max(T.maxCombo,T.combo); sfx.ok(); showCombo(T.combo); }
  else { T.combo=0; sfx.no(); showCombo(0); }
  T.cur++;
  updateTypeStat();
  if(T.cur>=T.ws.length){ finishType(); return; }
  renderType();
}
function updateTypeStat(){
  const done=T.cur, total=T.ws.length;
  const acc = done? Math.round(T.correct/done*100):100;
  $("statline").innerHTML=`<span class="stat">${done}<small>/${total}</small></span>`+
    `<span class="stat" style="color:var(--good)">${acc}%<small>acc</small></span>`+
    `<span class="stat" style="color:var(--warn)">🔥${T.combo}<small>combo</small></span>`;
}
function finishType(){
  renderType();
  const total=T.ws.length;
  const acc=Math.round(T.correct/total*100);
  const secs=Math.max(1,(Date.now()-T.start)/1000);
  const wpm=Math.round((total/secs)*60);
  const xp=Math.round(acc*0.9) + Math.round(total/4) + T.maxCombo;
  addXP(xp); bumpStreak();
  const best=recordBest(currentSectionId,"type",acc);
  if(acc>=90){ sfx.win(); burst(); } else if(acc>=60) sfx.ok(); else sfx.no();
  const s=getSection(currentSectionId);
  $("modebody").innerHTML=`
    <div class="result">
      <div class="big">${acc}%</div>
      <div style="color:var(--muted);margin-top:4px">${acc>=95?"Flawless. You know this. 🏆":acc>=80?"So close — clean up the red bits. 💪":acc>=50?"Good progress. Run it again. 📈":"Early days — back to Study &amp; Gaps. 🌱"}</div>
      <div class="row">
        <div class="kv"><b>${T.correct}/${total}</b><small>words</small></div>
        <div class="kv"><b>🔥${T.maxCombo}</b><small>best combo</small></div>
        <div class="kv"><b>${wpm}</b><small>wpm</small></div>
        <div class="kv"><b>+${xp}</b><small>XP</small></div>
      </div>
      ${best?'<div class="pill" style="border-color:var(--warn);color:var(--warn)">🏅 New personal best!</div>':''}
      <div class="actions" style="justify-content:center">
        <button class="btn primary" onclick="startMode('${currentSectionId}','type')">↻ Again</button>
        <button class="btn" onclick="startMode('${currentSectionId}','first')">🔤 First Letters</button>
        <button class="btn ghost" onclick="goHome()">← Menu</button>
      </div>
    </div>`;
  $("statline").innerHTML="";
}

/* ============================================================
   MODE: UNSCRAMBLE
   ============================================================ */
let O=null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function modeOrder(id){
  const s=getSection(id);
  const sents=sentences(s.text);
  O={sents,idx:0,correct:0,section:id};
  $("view").innerHTML=playShell(s,"Unscramble","tiles",`<div id="orderbody"></div>`);
  renderOrder();
}
function renderOrder(){
  if(O.idx>=O.sents.length){ return finishOrder(); }
  const sent=O.sents[O.idx];
  const ws=words(sent).map(w=>w.x);
  // build scrambled (ensure not identical for >1 word)
  let scr=shuffle(ws); let guard=0;
  while(ws.length>1 && scr.join("|")===ws.join("|") && guard++<6) scr=shuffle(ws);
  O.target=ws; O.placed=[];
  O.pool=scr.map((w,i)=>({w,id:i,used:false}));
  const body=`
    <div class="statline" style="margin-bottom:10px">
      <span class="stat">Sentence ${O.idx+1}<small>/${O.sents.length}</small></span>
      <span class="stat">${ws.length}<small> words</small></span>
    </div>
    <div class="answerbox" id="answer"></div>
    <div class="tiles" id="pool"></div>
    <div class="actions">
      <button class="btn" id="undoBtn">↩ Undo</button>
      <button class="btn" id="hintOrder">💡 Next word</button>
      <button class="btn primary" id="checkOrder">✓ Check</button>
    </div>
    <div class="note" id="orderNote">Tap the words in the right order to rebuild the sentence.</div>`;
  $("orderbody").innerHTML=body;
  $("statline").innerHTML=`<span class="stat" style="color:var(--good)">${O.correct}<small> solved</small></span>`;
  drawPool(); drawAnswer();
  $("pool").onclick=e=>{ const t=e.target.closest(".tile"); if(!t||t.classList.contains("ph")) return; placeTile(+t.dataset.id); };
  $("answer").onclick=e=>{ const t=e.target.closest(".tile"); if(!t) return; removeTile(+t.dataset.pos); };
  $("undoBtn").onclick=()=>{ if(O.placed.length) removeTile(O.placed.length-1); };
  $("hintOrder").onclick=()=>orderHint();
  $("checkOrder").onclick=()=>orderCheck();
}
function drawPool(){
  $("pool").innerHTML=O.pool.map(p=>`<div class="tile ${p.used?'ph':''}" data-id="${p.id}">${esc(p.w)}</div>`).join("");
}
function drawAnswer(){
  const a=$("answer");
  if(!O.placed.length){ a.innerHTML='<span style="color:var(--muted);align-self:center">tap words below…</span>'; return; }
  a.innerHTML=O.placed.map((p,i)=>`<div class="tile" data-pos="${i}">${esc(p.w)}</div>`).join("");
}
function placeTile(poolId){
  const p=O.pool.find(x=>x.id===poolId); if(!p||p.used) return;
  p.used=true; O.placed.push(p); sfx.ok(); drawPool(); drawAnswer();
}
function removeTile(pos){
  const p=O.placed.splice(pos,1)[0]; if(p){ p.used=false; } drawPool(); drawAnswer();
}
function orderHint(){
  const i=O.placed.length; if(i>=O.target.length) return;
  const need=loose(O.target[i]);
  const p=O.pool.find(x=>!x.used && loose(x.w)===need);
  if(p) placeTile(p.id);
}
function orderCheck(){
  const got=O.placed.map(p=>loose(p.w)).join("|");
  const want=O.target.map(loose).join("|");
  const ansTiles=[...$("answer").querySelectorAll(".tile")];
  if(got===want){
    ansTiles.forEach(t=>t.classList.add("ok"));
    O.correct++; sfx.great(); addXP(12);
    $("orderNote").innerHTML='<b style="color:var(--good)">Correct! ✓</b>';
    $("checkOrder").textContent = (O.idx+1>=O.sents.length)?"See results →":"Next sentence →";
    $("checkOrder").onclick=()=>{ O.idx++; renderOrder(); };
  } else {
    // mark first wrong
    let firstWrong=-1;
    O.placed.forEach((p,i)=>{ if(loose(p.w)!==loose(O.target[i]||"") && firstWrong<0) firstWrong=i; });
    ansTiles.forEach((t,i)=>{ t.classList.toggle("bad", firstWrong>=0 && i>=firstWrong); });
    sfx.no();
    $("orderNote").innerHTML='<b style="color:var(--bad)">Not quite</b> — the red tiles are out of place. Tap them to send them back.';
  }
}
function finishOrder(){
  const pct=Math.round(O.correct/O.sents.length*100);
  const xp=Math.round(pct*0.5)+10;
  addXP(xp); bumpStreak();
  const best=recordBest(O.section,"order",pct);
  if(pct>=90){sfx.win();burst();}
  $("modebody").innerHTML=`
    <div class="result">
      <div class="big">${pct}%</div>
      <div style="color:var(--muted)">${O.correct}/${O.sents.length} sentences rebuilt</div>
      <div class="row"><div class="kv"><b>+${xp}</b><small>XP</small></div></div>
      ${best?'<div class="pill" style="border-color:var(--warn);color:var(--warn)">🏅 New best!</div>':''}
      <div class="actions" style="justify-content:center">
        <button class="btn primary" onclick="startMode('${O.section}','order')">↻ Again</button>
        <button class="btn" onclick="startMode('${O.section}','type')">⌨️ Type It Out</button>
        <button class="btn ghost" onclick="goHome()">← Menu</button>
      </div>
    </div>`;
  $("statline").innerHTML="";
}

/* ============================================================
   BOOT
   ============================================================ */
$("muteBtn").onclick=()=>{ state.muted=!state.muted; save(); refreshHeader(); toast(state.muted?"🔇 Muted":"🔊 Sound on"); };
// reset on long-press of streak (hidden power feature)
$("streakPill").addEventListener("dblclick",()=>{
  if(confirm("Reset all progress (XP, levels, best scores)?")){ state=defaults(); save(); refreshHeader(); goHome(); toast("Progress reset"); }
});
refreshHeader();
renderHome();
window.startMode=startMode; window.goHome=goHome;
</script>
</body>
