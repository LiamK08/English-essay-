<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>Essay Memoriser — Curious Incident (Module B)</title>
<style>
  :root{
    --bg:#0f1020; --bg2:#171830; --card:#1c1d3a; --card2:#23254a;
    --ink:#eef0ff; --muted:#9aa0c7; --line:#2c2e58;
    --accent:#7c5cff; --accent2:#22d3ee; --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --ring-bg:#2a2c55; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%, #232450 0%, var(--bg) 55%) fixed;
    color:var(--ink); min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  .wrap{max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  button{font-family:inherit;touch-action:manipulation}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);
    padding:11px 16px;border-radius:12px;font-size:15px;cursor:pointer;font-weight:600;
    transition:transform .08s, background .15s, border-color .15s;user-select:none}
  .btn:hover{background:#2c2e63;border-color:#3a3d7a}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#9a7bff);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
  .btn.good{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#04231a}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}

  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0;cursor:pointer}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;overflow:hidden;box-shadow:var(--shadow)}
  .logo img{width:100%;height:100%;display:block}
  .brand h1{font-size:16px;margin:0;line-height:1.15}
  .brand p{margin:0;font-size:12px;color:var(--muted)}
  .hstats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lvl{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 12px}
  .lvl .num{font-weight:800}
  .xpbar{width:104px;height:9px;border-radius:999px;background:var(--ring-bg);overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%}
  .icbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:17px;padding:0}

  .hero{background:linear-gradient(135deg,#20224a,#181a36);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .bigring{--p:0;width:96px;height:96px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--ring-bg) 0);display:grid;place-items:center}
  .bigring::after{content:attr(data-l);width:78px;height:78px;border-radius:50%;background:#191b38;display:grid;place-items:center;font-size:20px;font-weight:900}
  .heroinfo{flex:1;min-width:200px}
  .heroinfo h2{margin:0 0 3px;font-size:19px}
  .heroinfo p{margin:0 0 11px;color:var(--muted);font-size:13.5px}
  .herobtns{display:flex;gap:9px;flex-wrap:wrap}

  /* 3-Day Coach */
  .coachwrap{background:linear-gradient(135deg,#241a4e,#15182f);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .daybadge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px}
  .coachwrap h2{margin:9px 0 2px;font-size:20px}
  .goal{color:var(--muted);font-size:13.5px;margin:0 0 13px;max-width:62ch}
  .pgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px}
  .pcell{flex:1;min-width:104px;background:#0e0f22;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .pcell b{font-size:18px}.pcell small{color:var(--muted);display:block;font-size:11px;margin-top:1px}
  .pbar{height:8px;border-radius:999px;background:var(--ring-bg);overflow:hidden;margin-top:8px}
  .pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
  .coachbtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .subhead{font-weight:700;color:var(--muted);font-size:12px;margin:8px 2px 11px;text-transform:uppercase;letter-spacing:.05em}
  .stepdots{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .stepdots i{width:9px;height:9px;border-radius:50%;background:var(--ring-bg);display:inline-block}
  .stepdots i.done{background:var(--good)}.stepdots i.cur{background:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
  .cue{background:#0e0f22;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:15px;margin-bottom:10px}
  .lede{font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .gradechip{display:inline-block;font-weight:800;border-radius:999px;padding:4px 12px;font-size:13px}
  .scilist{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
  .scilist b{color:var(--accent2)}
  .step{font-size:12.5px;background:#262853;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
  .step b{color:var(--accent2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative;transition:transform .1s,border-color .15s,background .15s;display:flex;flex-direction:column;gap:9px}
  .scard:hover{transform:translateY(-2px);border-color:#41459a;background:var(--card2)}
  .scard.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,92,255,.35)}
  .scard .ico{font-size:25px}
  .scard h3{margin:0;font-size:14.5px}
  .scard .meta{font-size:11.5px;color:var(--muted)}
  .ring{--p:0;width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--ring-bg) 0);display:grid;place-items:center;position:absolute;top:12px;right:12px}
  .ring::after{content:attr(data-label);width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:10px;font-weight:800}
  .scard.active .ring::after{background:var(--card2)}

  #panel{margin-top:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:9px}
  .panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .modes{display:flex;flex-direction:column;gap:11px}
  .moderow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .moderow .label{font-weight:700;min-width:130px;display:flex;align-items:center;gap:8px}
  .moderow .desc{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:-2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--ink);padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:#2c2e63}

  .play{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .playhead .title{font-weight:800;font-size:16px;margin-right:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .playhead .title .tag{font-size:11px;color:var(--muted);font-weight:600;background:var(--bg2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .statline{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
  .stat small{color:var(--muted);font-weight:600}

  .passage{font-size:18px;line-height:2.05;letter-spacing:.1px}
  .passage.read{font-size:19px;line-height:1.95}
  .adapt{color:var(--accent2);border-bottom:2px dotted var(--accent2);padding:0 2px;font-style:italic}
  .qte{color:#ffd9a8}

  input.blank{background:#0e0f22;border:0;border-bottom:2px solid var(--accent);color:var(--ink);
    font:inherit;font-weight:700;text-align:center;padding:2px 4px;margin:0 1px;border-radius:6px 6px 0 0;outline:none;min-width:34px;transition:background .15s,border-color .15s}
  input.blank:focus{background:#181a3a}
  input.blank.ok{color:var(--good);border-color:var(--good);background:rgba(52,211,153,.08)}
  input.blank.bad{color:var(--bad);border-color:var(--bad);background:rgba(251,113,133,.08)}
  input.blank.reveal{color:var(--warn);border-color:var(--warn)}

  .w{padding:0 1px;border-radius:5px}
  .w.correct{color:var(--good)}
  .w.wrong{color:var(--bad);text-decoration:underline wavy var(--bad)}
  .w.hint{color:var(--muted);opacity:.55}
  .w.up{color:var(--muted);opacity:.4;letter-spacing:1px}
  .w.cur{background:rgba(124,92,255,.28);box-shadow:0 0 0 2px rgba(124,92,255,.5);border-radius:6px;color:#fff;font-weight:700}
  .w.flash{background:rgba(251,113,133,.3);box-shadow:0 0 0 2px var(--bad);color:#fff;border-radius:6px}
  .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent2);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .fl .w{cursor:pointer;color:var(--muted);transition:color .12s}
  .fl .w:hover{color:var(--ink)}
  .fl .w.shown{color:var(--good);font-weight:600;cursor:default}

  .typebar{position:sticky;bottom:0;margin-top:16px;display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 0 max(2px,env(safe-area-inset-bottom))}
  #typein,#examarea{background:#0e0f22;border:2px solid var(--accent);border-radius:13px;color:var(--ink);font-size:18px;font-weight:600;padding:13px 15px;outline:none;width:100%}
  #typein{flex:1}
  #typein::placeholder{color:#6b71a3;font-weight:500}
  #examarea{min-height:200px;line-height:1.8;resize:vertical;font-weight:500}

  .tiles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .answerbox{min-height:54px;background:#0e0f22;border:1px dashed var(--line);border-radius:13px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:15px;font-weight:600;cursor:pointer;user-select:none;transition:transform .07s}
  .tile:hover{background:#2c2e63}
  .tile:active{transform:scale(.96)}
  .tile.ok{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good)}
  .tile.bad{background:rgba(251,113,133,.16);border-color:var(--bad);color:var(--bad)}
  .tile.ph{visibility:hidden}

  .diff .w.correct{color:var(--good)}
  .diff .w.miss{color:var(--bad);background:rgba(251,113,133,.13);border-radius:4px;text-decoration:underline wavy var(--bad)}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  .hidden{display:none!important}

  .result{text-align:center;padding:16px 6px}
  .result .big{font-size:54px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .result .kv{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:88px}
  .result .kv b{display:block;font-size:22px}
  .result .kv small{color:var(--muted)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  .combo{position:fixed;right:18px;bottom:84px;font-weight:900;font-size:15px;color:var(--warn);opacity:0;transition:.2s;z-index:40}
  .combo.show{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(6,6,18,.7);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:70;padding:18px}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 12px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .setrow:last-of-type{border-bottom:0}

  footer.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.7}
  @media(max-width:560px){
    .passage{font-size:17px;line-height:1.95}
    .moderow .label{min-width:0}
    .bigring{width:84px;height:84px}.bigring::after{width:68px;height:68px;font-size:18px}
  }
</style>
</head>

<canvas id="confetti"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand" onclick="goHome()">
      <div class="logo" style="background:linear-gradient(135deg,#7c5cff,#22d3ee);display:grid;place-items:center;font-size:22px"><img src="./icon-192.png" alt="" style="width:100%;height:100%" onerror="this.style.display='none';this.parentNode.textContent='📖'"></div>
      <div>
        <h1>Essay Memoriser</h1>
        <p>Curious Incident · Module B</p>
      </div>
    </div>
    <div class="hstats">
      <button class="btn sm primary hidden" id="installBtn">⤓ Install</button>
      <div class="lvl" title="Level &amp; XP"><span>Lv <span class="num" id="lvlNum">1</span></span><div class="xpbar"><i id="xpFill"></i></div></div>
      <span class="pill" id="streakPill" title="Daily streak (double-tap to reset all)">🔥 <span id="streakNum">0</span></span>
      <button class="btn icbtn ghost" id="setBtn" title="Settings">⚙️</button>
    </div>
  </header>

  <div id="home"></div>
  <div id="panel"></div>
  <div id="view"></div>

  <footer class="foot">
    Built to make memorising less boring · works offline · your progress is saved on this device.
  </footer>
</div>

<div id="toast"></div>
<div class="combo" id="comboTag"></div>
<div id="modalHost"></div>

<script>
/* ============================================================
   ESSAY DATA  (Quote Bank intentionally excluded)
   [square brackets] = adaptable hook / concept phrase
   ============================================================ */
const SECTIONS = [
  { id:"intro", name:"Introduction", short:"Intro", icon:"🎯",
    text:`Situated within a post-9/11 society marked by eroded public trust and a growing cultural awareness of neurodiversity, Mark Haddon’s novel The Curious Incident of the Dog in the Night-Time (2003) constructs a distinctive first-person narrative voice, defined by Christopher Boone’s literal cognition, to destabilise conventional notions of normality, truth and human connection. Through a hybrid form and distinctive narrative elements, Haddon filters the entire world through Christopher’s logical mind, revealing that his perception, his pursuit of truth and his hard-won agency are capabilities realised not despite his difference but through it, and challenging how we define [normality and ability].` },
  { id:"bp1", name:"Body 1 · Perception", short:"Perception", icon:"🧠",
    text:`A mind that orders the world through logic and pattern rather than emotion perceives not in a lesser way but in a different one, exposing how narrowly society defines normality. Haddon embeds this difference in the novel’s structure, numbering its chapters with prime numbers so that the form itself enacts Christopher’s logical cognition. The recurring mathematical motif becomes a worldview through the simile ‘prime numbers are like life,’ which captures Christopher finding meaning in structure rather than sentiment. His intelligence is conveyed through accumulation, his self-introduction listing the world’s capitals and ‘every prime number up to 7,057,’ so that information becomes the substance of his identity. Yet the same mind that masters facts finds people opaque, and the simple declarative ‘I find people confusing’ enacts the literalism it describes, reducing the ambiguity of social life to a flat statement that signals not stupidity but a different ordering of priorities. Through this convergence of structure, motif and language, Haddon positions such perception as valid and capable, unsettling the assumption that to think differently is to think less.` },
  { id:"bp2", name:"Body 2 · Truth", short:"Truth", icon:"⚖️",
    text:`Even well-intentioned deception corrodes the trust on which relationships depend, exposing honesty as the fragile but indispensable foundation of human connection. Haddon establishes truth as the bedrock of his protagonist through the declarative ‘I do not tell lies,’ a flat statement of character that leaves Christopher acutely vulnerable to a world that lies with ease. This vulnerability is sharpened by dramatic irony when Christopher reasons that his father ‘always tells me the truth, which means that he loves me’; the reader, who knows that Ed has invented the death of Christopher’s mother, recognises the trust as tragically misplaced, so that the equation of truth with love becomes the fault line along which the relationship breaks. That break is delivered through the epistolary form, as the discovery of his mother’s hidden letters exposes the deception and the plain declarative ‘Father had lied about this’ registers the totality of the betrayal. Crucially, Haddon refuses easy reconciliation, rebuilding trust only through honesty, as the emphatic repetition of Ed’s promise that he ‘would never, ever do anything to hurt’ him restores their bond on truthful terms. In doing so, the novel affirms that a genuine relationship can rest on nothing less than truth.` },
  { id:"bp3", name:"Body 3 · Agency", short:"Agency", icon:"🚀",
    text:`Genuine agency is measured not by conformity to a norm but by the courage to act through fear and the capability to author one’s own future. Christopher’s solo journey to London dramatises this, the visceral imagery of a station that leaves him ‘giddy and sick’ conveying the sensory ordeal he must overcome. Yet Haddon portrays him problem-solving rather than retreating, as the recurring motif of order returns and he narrows the chaos to ‘one sign at a time,’ turning his need for system into a tool for survival so that his agency lies in the very cognition the world has misread as a limitation. That capability hardens into ambition through the future tense of ‘I will become a scientist,’ which projects a self that has outgrown its earlier confinement. Haddon consolidates the transformation in the novel’s triumphant final cadence, where the high modality of ‘I can do anything,’ reinforced by the repetition of the first-person pronoun, converts a list of obstacles overcome into a declaration of selfhood. In closing on this assertion, Haddon redefines growth itself, inviting the reader to measure ability not against a narrow norm but against the courage and competence Christopher has proven to be entirely his own.` },
  { id:"concl", name:"Conclusion", short:"Conclusion", icon:"🏁",
    text:`Across the novel, Haddon moves Christopher from a precise but isolating perception, through the rupture and repair of trust, to the agency of his journey and the future he claims beyond it. Because this growth is rendered through the form and language of Christopher’s own mind, the novel insists that his perception, his integrity and his capability are not achievements made despite his difference but expressions of it. In doing so, The Curious Incident of the Dog in the Night-Time asks its reader to abandon a narrow measure of [normality and ability], and to recognise that understanding, courage and selfhood can be reached by more paths than one.` },
];
const WHOLE = { id:"whole", name:"Whole Essay", short:"Whole", icon:"👑", text: SECTIONS.map(s=>s.text).join("\n\n") };
const ALL = SECTIONS.concat([WHOLE]);
const getSection = id => ALL.find(s=>s.id===id);

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const SAVE_KEY="essayMemoriser.v2";
let state=load();
function defaults(){ return { xp:0, best:{}, weak:{}, streak:{count:0,last:null}, last:null,
  srs:{}, plan:{start:null},
  settings:{sound:true, hint:"first", fuzzy:true} }; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s==="object"){ const d=defaults(); return Object.assign(d,s,{settings:Object.assign(d.settings,s.settings||{})}); } }catch(e){} return defaults(); }
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(state)); }catch(e){} }
function bestOf(id){ return state.best[id]||(state.best[id]={cloze:0,type:0,first:0,order:0,exam:0}); }
function recordBest(id,mode,pct){ const b=bestOf(id); if(pct>(b[mode]||0)){ b[mode]=Math.round(pct); save(); return true;} return false; }
function mastery(id){ const b=state.best[id]; if(!b) return 0;
  return Math.round(Math.max(b.exam||0, b.type||0, b.coach||0, (b.cloze||0)*0.9, (b.first||0)*0.7, (b.order||0)*0.8)); }
function overallMastery(){ const m=SECTIONS.map(s=>mastery(s.id)); return Math.round(m.reduce((a,b)=>a+b,0)/m.length); }

/* weak words */
function weakAdd(secId,wi){ if(secId==="whole") return; state.weak[secId]=state.weak[secId]||{}; state.weak[secId][wi]=Math.min(9,(state.weak[secId][wi]||0)+1); save(); }
function weakClear(secId,wi){ if(state.weak[secId]&&state.weak[secId][wi]){ state.weak[secId][wi]--; if(state.weak[secId][wi]<=0) delete state.weak[secId][wi]; save(); } }
function weakList(){ const out=[]; for(const sid in state.weak){ const sec=getSection(sid); if(!sec) continue; const ws=words(sec.text);
  for(const wi in state.weak[sid]){ const c=state.weak[sid][wi]; if(c>0&&ws[+wi]) out.push({sid,wi:+wi,count:c,word:ws[+wi].x}); } }
  out.sort((a,b)=>b.count-a.count); return out; }
function weakCount(){ return weakList().length; }

/* levels */
const levelFor=xp=>Math.floor(Math.sqrt(xp/25));
const xpForLevel=L=>25*L*L;
function refreshHeader(){
  const L=levelFor(state.xp), cur=xpForLevel(L), next=xpForLevel(L+1);
  $("lvlNum").textContent=L+1;
  $("xpFill").style.width=(next>cur?((state.xp-cur)/(next-cur))*100:100)+"%";
  $("streakNum").textContent=state.streak.count||0;
}
function addXP(n){ const b=levelFor(state.xp); state.xp+=n; save(); const a=levelFor(state.xp); refreshHeader();
  if(a>b){ toast("⭐ Level up! You reached Level "+(a+1)); burst(); } }
function bumpStreak(){ const t=todayStr(); const s=state.streak; if(s.last===t) return;
  const ys=dstr(new Date(Date.now()-864e5)); s.count=(s.last===ys)?(s.count||0)+1:1; s.last=t; save(); refreshHeader(); }
const todayStr=()=>dstr(new Date());
const dstr=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();

/* ============================================================
   TEXT TOOLS  (core — unit tested)
   ============================================================ */
const stripBrackets=t=>t.replace(/[\[\]]/g,"");
const loose=w=>(w||"").toLowerCase().replace(/[’‘`']/g,"").replace(/[^a-z0-9]/g,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const WORD_RE=/[A-Za-z0-9]+(?:['’\-\/,][A-Za-z0-9]+)*/g;
function tokenize(text){ text=stripBrackets(text); const toks=[]; let last=0,m; WORD_RE.lastIndex=0;
  while((m=WORD_RE.exec(text))){ if(m.index>last) toks.push({t:"sep",x:text.slice(last,m.index)});
    toks.push({t:"w",x:m[0],c:loose(m[0])}); last=m.index+m[0].length; }
  if(last<text.length) toks.push({t:"sep",x:text.slice(last)}); return toks; }
const words=text=>tokenize(text).filter(t=>t.t==="w");
const wordCount=text=>words(text).length;
function studyHTML(text){ let out="",last=0,m; const re=/\[([^\]]*)\]/g;
  while((m=re.exec(text))){ out+=quoteHL(text.slice(last,m.index)); out+='<span class="adapt">'+quoteHL(m[1])+'</span>'; last=m.index+m[0].length; }
  out+=quoteHL(text.slice(last)); return out; }
const quoteHL=t=>esc(t).replace(/(‘[^’]*’)/g,'<span class="qte">$1</span>');
function sentences(text){ text=stripBrackets(text).replace(/\s+/g," ").trim();
  return text.split(/(?<=[.;!?]['’”"]?)\s+/).map(s=>s.trim()).filter(Boolean); }

/* fuzzy spelling tolerance — Damerau–Levenshtein (handles missing/wrong/swapped letters).
   same(typed,target) decides if a typed word counts as the target. Tolerance scales with
   the TARGET word length so short function words still need to be exact. */
function editDistance(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  const d=Array.from({length:m+1},(_,i)=>{const r=new Int32Array(n+1); r[0]=i; return r;});
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const cost=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[m][n]; }
function tolFor(L){ return L<=2?0 : L<=6?1 : 2; }
function same(typed,target){ if(typed===target) return true;
  if(!state.settings.fuzzy || !typed || !target) return false;
  const tol=tolFor(target.length);
  if(tol===0 || Math.abs(typed.length-target.length)>tol) return false;
  return editDistance(typed,target)<=tol; }

/* word-level LCS diff for Exam mode */
function wordDiff(orig,typed){
  const n=orig.length,m=typed.length;
  const dp=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]= same(typed[j],orig[i]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const matched=new Uint8Array(n); let i=0,j=0;
  while(i<n&&j<m){ if(same(typed[j],orig[i])){ matched[i]=1; i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return matched;
}

   SOUND
   ============================================================ */
let actx=null;
function beep(freq,dur,type,vol){ if(!state.settings.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.value=vol||0.05;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(dur||0.12)); o.stop(actx.currentTime+(dur||0.12)); }catch(e){} }
const sfx={ ok(){beep(660,.09,"triangle",.05);}, great(){beep(880,.08,"triangle",.05);setTimeout(()=>beep(1320,.1,"triangle",.05),70);},
  no(){beep(150,.16,"sawtooth",.04);}, win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.13,"triangle",.06),i*110));} };

const $=id=>document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }
function showCombo(n){ const c=$("comboTag"); if(n>=3){ c.textContent="🔥 "+n+" combo"; c.classList.add("show"); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.remove("show"),900);} else c.classList.remove("show"); }
function burst(){ const cv=$("confetti"),ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#7c5cff","#22d3ee","#34d399","#fbbf24","#fb7185","#fff"],P=[];
  for(let i=0;i<150;i++)P.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,g:.32+Math.random()*.15,s:6+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  let f=0;(function run(){ ctx.clearRect(0,0,cv.width,cv.height); f++;
    P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55); ctx.restore(); });
    if(f<130) requestAnimationFrame(run); else ctx.clearRect(0,0,cv.width,cv.height); })(); }

let currentSectionId=null;
function recommend(){
  // lowest-mastery section + the next rung on its ladder
  let lo=SECTIONS[0], lm=mastery(SECTIONS[0].id);
  SECTIONS.forEach(s=>{ const m=mastery(s.id); if(m<lm){ lm=m; lo=s; } });
  let mode = lm===0?"study": lm<40?"cloze": lm<70?"first": lm<90?"type":"exam";
  return {sec:lo, mode, m:lm};
}

  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  if(mode!=="weak"){ state.last={section:id,mode,diff:d||0}; save(); }
  $("home").classList.add("hidden"); $("panel").classList.add("hidden");
  ({study:modeStudy,cloze:modeCloze,first:modeFirst,type:modeType,order:modeOrder,exam:modeExam,weak:modeWeak})[mode](id,d);
  $("view").scrollIntoView({behavior:"smooth",block:"start"});
}

  renderHome(); if(currentSectionId) renderPanel(currentSectionId); window.scrollTo({top:0,behavior:"smooth"}); }

/* ============================================================
   MODE: FILL THE GAPS
   ============================================================ */
let C=null;
function pickBlanks(ws,diff){ const N=ws.length; if(diff>=1) return new Set(ws.map((_,i)=>i));
  const stop=new Set("the a an of to and in on that as is are was his her its it he we by but not this for with at from which who".split(" "));
  const scored=ws.map((w,i)=>({i,s:(stop.has(w.c)?0:1.2)+Math.random()})); scored.sort((a,b)=>b.s-a.s);
  return new Set(scored.slice(0,Math.max(1,Math.round(diff*N))).map(o=>o.i)); }
function modeCloze(id,diff){ const s=getSection(id),toks=tokenize(s.text),ws=toks.filter(t=>t.t==="w");
  const blanks=pickBlanks(ws,diff); C={id,toks,ws,blanks,diff,total:blanks.size,inputs:[]};
  let wi=-1,html=""; toks.forEach(t=>{ if(t.t==="sep"){html+=esc(t.x);return;} wi++;
    if(blanks.has(wi)) html+=`<input class="blank" data-i="${wi}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(34,t.x.length*11+12)}px">`;
    else html+=`<span class="w">${esc(t.x)}</span>`; });
  const dn=({0.2:"Easy",0.4:"Medium",0.6:"Hard",1:"Expert"})[diff]||"";
  $("view").innerHTML=playShell(s,"Fill the Gaps · "+dn,dn,`<div class="passage">${html}</div>
    <div class="actions"><button class="btn" id="hintBtn">💡 First letters</button>
      <button class="btn primary" id="checkBtn">✓ Check</button><button class="btn" id="revealBtn">👁 Reveal</button></div>
    <div class="note" id="clozeNote">Correct words turn green and jump you to the next blank.</div>`);
  const inputs=[...$("modebody").querySelectorAll("input.blank")]; C.inputs=inputs; updateClozeStat();
  inputs.forEach((inp,idx)=>{ inp.addEventListener("input",()=>{ const wi=+inp.dataset.i,target=ws[wi];
      inp.classList.remove("bad","reveal");
      if(same(loose(inp.value),target.c) && inp.value.trim()!==""){ if(!inp.classList.contains("ok")){inp.classList.add("ok");sfx.ok();}
        const nxt=inputs[idx+1]; if(nxt&&!nxt.classList.contains("ok")) nxt.focus(); } else inp.classList.remove("ok"); updateClozeStat(); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();(inputs[idx+1]||$("checkBtn")).focus();} }); });
  if(inputs[0]) inputs[0].focus();
  $("hintBtn").onclick=()=>{ inputs.forEach(inp=>{ if(!inp.classList.contains("ok")) inp.placeholder=ws[+inp.dataset.i].x[0]+"…"; }); toast("First-letter hints added"); };
  $("revealBtn").onclick=()=>{ inputs.forEach(inp=>{ if(!inp.classList.contains("ok")){ inp.value=ws[+inp.dataset.i].x; inp.classList.add("reveal"); inp.classList.remove("bad"); } }); toast("Revealed — now redo from memory"); };
  $("checkBtn").onclick=()=>clozeCheck();
}
function updateClozeStat(){ const ok=C.inputs.filter(i=>i.classList.contains("ok")).length;
  $("statline").innerHTML=`<span class="stat" style="color:var(--good)">${ok}<small>/${C.total} correct</small></span>`; }
function clozeCheck(){ let ok=0; C.inputs.forEach(inp=>{ const wi=+inp.dataset.i;
    if(same(loose(inp.value),C.ws[wi].c) && inp.value.trim()!==""){ inp.classList.add("ok"); inp.classList.remove("bad"); ok++; }
    else { inp.classList.add("bad"); inp.classList.remove("ok"); weakAdd(C.id,wi); } });
  const pct=C.total?Math.round(ok/C.total*100):100, xp=Math.round(pct*0.5*(0.6+C.diff));
  addXP(xp); bumpStreak(); const best=recordBest(C.id,"cloze",pct);
  if(pct>=90){sfx.win();burst();} else if(pct>=60)sfx.ok(); else sfx.no();
  $("clozeNote").innerHTML=`<b style="color:${pct>=80?'var(--good)':pct>=50?'var(--warn)':'var(--bad)'}">${ok}/${C.total} · ${pct}%</b> · +${xp} XP${best?" · 🏅 best!":""} — red = wrong (now in your weak-words drill).`;
  updateClozeStat();
}

let T=null;
function modeType(id){ const s=getSection(id),toks=tokenize(s.text),ws=toks.filter(t=>t.t==="w");
  T={id,toks,ws,cur:0,status:[],buffer:"",correct:0,combo:0,maxCombo:0,start:0,hint:state.settings.hint};
  $("view").innerHTML=playShell(s,"Type It Out","boss",`<div class="passage" id="typepass"></div>
    <div class="typebar"><input id="typein" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the highlighted word, then space…">
      <button class="btn sm" id="hintCycle"></button><button class="btn sm" id="skipWord" title="Reveal this word">💡</button></div>
    <div class="note">Type each word then press <b>space</b>. Wrong words flash the answer. Cycle the hint down to <b>none</b> when confident.</div>`);
  renderType(); updateTypeStat(); setHintLabel();
  const inp=$("typein");
  inp.addEventListener("keydown",e=>{
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); typeCommit(inp.value); inp.value=""; T.buffer=""; }
    else if(e.key==="Backspace" && inp.value==="" && T.cur>0){ e.preventDefault(); T.cur--; T.status.pop(); T.correct=T.status.filter(x=>x==="correct").length; renderType(); updateTypeStat(); }
  });
  inp.addEventListener("input",()=>{ T.buffer=inp.value; const c=$("curword"); if(c) c.innerHTML=esc(T.buffer)+'<span class="caret"></span>'; });
  $("hintCycle").onclick=()=>{ T.hint=T.hint==="full"?"first":T.hint==="first"?"none":"full"; setHintLabel(); renderType(); };
  $("skipWord").onclick=()=>{ typeCommit(T.ws[T.cur]?T.ws[T.cur].x:"",true); $("typein").value=""; T.buffer=""; };
  setTimeout(()=>inp.focus(),60);
}
const setHintLabel=()=>$("hintCycle").textContent="Hint: "+(T.hint==="full"?"full words":T.hint==="first"?"first letters":"none");
function hintFor(tok){ if(T.hint==="full") return '<span class="w hint">'+esc(tok.x)+'</span>';
  if(T.hint==="first") return '<span class="w up">'+esc(tok.x[0])+'·'.repeat(Math.max(0,tok.x.length-1))+'</span>';
  return '<span class="w up">'+'·'.repeat(tok.x.length)+'</span>'; }
function renderType(){ let wi=-1,html=""; T.toks.forEach(t=>{ if(t.t==="sep"){html+=esc(t.x);return;} wi++;
    if(wi<T.cur) html+='<span class="w '+(T.status[wi]||"correct")+'">'+esc(t.x)+'</span>';
    else if(wi===T.cur) html+='<span class="w cur" id="curword">'+(T.buffer?esc(T.buffer):'')+'<span class="caret"></span></span>';

  $("typepass").innerHTML=html; const c=$("curword"); if(c) c.scrollIntoView({block:"nearest"}); }
function typeCommit(raw,forced){ raw=(raw||"").trim(); if(!forced&&raw==="") return; if(T.start===0)T.start=Date.now();
  const tok=T.ws[T.cur]; if(!tok) return; const ok=!forced&&same(loose(raw),tok.c);

  if(ok){ T.correct++; T.combo++; T.maxCombo=Math.max(T.maxCombo,T.combo); sfx.ok(); showCombo(T.combo); }
  else { T.combo=0; sfx.no(); showCombo(0); weakAdd(T.id,T.cur); flashWord(T.cur); }

   MODE: UNSCRAMBLE

let O=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function modeOrder(id){ const s=getSection(id); O={id,sents:sentences(s.text),idx:0,correct:0};
  $("view").innerHTML=playShell(s,"Unscramble","tiles",`<div id="orderbody"></div>`); renderOrder(); }
function renderOrder(){ if(O.idx>=O.sents.length) return finishOrder();
  const ws=words(O.sents[O.idx]).map(w=>w.x); let scr=shuffle(ws),guard=0;
  while(ws.length>1&&scr.join("|")===ws.join("|")&&guard++<6) scr=shuffle(ws);
  O.target=ws; O.placed=[]; O.pool=scr.map((w,i)=>({w,id:i,used:false}));
  $("orderbody").innerHTML=`<div class="statline" style="margin-bottom:10px"><span class="stat">Sentence ${O.idx+1}<small>/${O.sents.length}</small></span><span class="stat">${ws.length}<small> words</small></span></div>

const drawPool=()=>$("pool").innerHTML=O.pool.map(p=>`<div class="tile ${p.used?'ph':''}" data-id="${p.id}">${esc(p.w)}</div>`).join("");
function drawAnswer(){ const a=$("answer"); a.innerHTML=O.placed.length?O.placed.map((p,i)=>`<div class="tile" data-pos="${i}">${esc(p.w)}</div>`).join(""):'<span style="color:var(--muted);align-self:center">tap words below…</span>'; }
function placeTile(pid){ const p=O.pool.find(x=>x.id===pid); if(!p||p.used) return; p.used=true; O.placed.push(p); sfx.ok(); drawPool(); drawAnswer(); }
function removeTile(pos){ const p=O.placed.splice(pos,1)[0]; if(p) p.used=false; drawPool(); drawAnswer(); }
function orderCheck(){ const got=O.placed.map(p=>loose(p.w)).join("|"),want=O.target.map(loose).join("|");

/* ============================================================
   3-DAY COACH  — chunked successive-relearning scheduler
   Implements: retrieval practice + spacing to a criterion (successive
   relearning), read-recite-review, production effect (recite aloud),
   errorful generation + feedback, chunking + chaining, expanding
   intervals tuned to a 3-day window, interleaving, overlearning.
   ============================================================ */
const DAY_MS=86400000, MIN_MS=60000;
const LADDER=[10,30,120,480,1440,2880];   // minutes between reviews (expanding)
const CRITERION=3;                          // correct recalls to "master" a chunk
const DAY_GOALS={
  1:"Encode every line and earn a first correct recall — read it, say it aloud, then recall it with feedback.",
  2:"Spaced retrieval + chaining — re-test yesterday's lines (sleep helped!), rehearse the joins between sentences, and interleave paragraphs.",
  3:"Overlearn & simulate — full first-letter recitation, then timed exam write-outs of the whole essay, drilling any misses."
};

/* --- chunking: sentence-sized lines, long sentences split at clause breaks --- */
function chunkText(text){ const MAXW=16, HARD=20, out=[];
  const hardSplit=p=>{ let seg="",n=0; tokenize(p).forEach(t=>{ seg+=t.x;
    if(t.t==="w" && ++n>=MAXW){ out.push(seg.trim()); seg=""; n=0; } }); if(seg.trim()) out.push(seg.trim()); };
  sentences(text).forEach(s=>{
    if(words(s).length<=MAXW){ out.push(s); return; }
    let buf="";
    s.split(/(?<=[,;:])\s+/).forEach(p=>{
      if(words(p).length>HARD){ if(buf){out.push(buf);buf="";} hardSplit(p); return; }
      const cand=buf?buf+" "+p:p;
      if(buf && words(cand).length>MAXW){ out.push(buf); buf=p; } else buf=cand;
    });
    if(buf) out.push(buf);
  });
  const merged=[]; out.map(x=>x.trim()).filter(Boolean).forEach(c=>{
    if(merged.length && words(c).length<4) merged[merged.length-1]+=" "+c; else merged.push(c); });
  return merged; }
let CHUNKS=null, CHUNK_BY_ID=null;
function buildChunks(){ if(CHUNKS) return CHUNKS; CHUNKS=[];
  SECTIONS.forEach(sec=>{ let off=0; chunkText(sec.text).forEach((t,i,arr)=>{
    CHUNKS.push({id:sec.id+"#"+i, secId:sec.id, idx:i, text:t, prevText:i>0?arr[i-1]:null, wordStart:off});
    off+=wordCount(t); }); });
  CHUNK_BY_ID={}; CHUNKS.forEach(c=>CHUNK_BY_ID[c.id]=c); return CHUNKS; }

/* --- spaced-repetition state per chunk --- */
function srsOf(id){ return state.srs[id] || (state.srs[id]={reps:0,lapses:0,intervalMin:0,due:0,introduced:false,lastGrade:null}); }
const planStarted=()=>!!(state.plan && state.plan.start);
function startPlan(){ state.plan={start:Date.now()}; save(); }
function restartPlan(){ state.srs={}; state.plan={start:Date.now()}; save(); }
function planDay(){ if(!planStarted()) return 1; return Math.min(3, Math.floor((Date.now()-state.plan.start)/DAY_MS)+1); }
function dueList(now){ buildChunks(); now=now||Date.now();
  return CHUNKS.filter(c=>{ const s=srsOf(c.id); return s.introduced && s.reps<CRITERION && s.due<=now; })
    .sort((a,b)=>srsOf(a.id).due-srsOf(b.id).due); }
function newList(){ buildChunks(); return CHUNKS.filter(c=>!srsOf(c.id).introduced); }
function introducedCount(){ buildChunks(); return CHUNKS.filter(c=>srsOf(c.id).introduced).length; }
function masteredCount(){ buildChunks(); return CHUNKS.filter(c=>srsOf(c.id).reps>=CRITERION).length; }
function nextDueAt(){ buildChunks(); const t=CHUNKS.map(c=>srsOf(c.id)).filter(s=>s.introduced&&s.reps<CRITERION).map(s=>s.due);
  return t.length?Math.min.apply(null,t):null; }

/* --- grading (errorful generation: attempt, then feedback updates schedule) --- */
const gradeFromAccuracy=acc=>acc>=0.95?"easy":acc>=0.8?"good":acc>=0.5?"hard":"again";
function applyGrade(id,grade){ const s=srsOf(id); s.introduced=true;
  if(grade==="again"){ s.lapses++; s.reps=Math.max(0,s.reps-1); s.intervalMin=10; }
  else if(grade==="hard"){ s.reps=Math.max(1,s.reps); s.intervalMin=Math.max(10,Math.round((s.intervalMin||LADDER[1])*0.6)); }
  else { s.reps=Math.min(LADDER.length-1, s.reps+(grade==="easy"?2:1)); s.intervalMin=LADDER[Math.min(s.reps,LADDER.length-1)]; }
  s.due=Date.now()+s.intervalMin*MIN_MS; s.lastGrade=grade; save(); return s; }

/* --- session builder: clear due reviews (interleaved), then introduce a few new --- */
const newPerSession=()=>planDay()>=3?2:5;
function buildSession(){ const due=dueList().slice(0,8);
  const room=Math.max(0,6-due.length);
  const news=room>0?newList().slice(0,Math.min(room,newPerSession())):[];
  return due.map(c=>({type:"retrieve",c})).concat(news.map(c=>({type:"learn",c}))); }

/* --- helpers --- */
function flCue(text){ return tokenize(text).map(t=>t.t==="sep"?esc(t.x):maskWord(t.x)).join(""); }
function tailWords(text,n){ return words(text).slice(-n).map(x=>x.x).join(" "); }
function speak(t){ if(!("speechSynthesis" in window)) return; const u=new SpeechSynthesisUtterance(stripBrackets(t)); u.rate=.95; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
function relTime(ts){ const d=ts-Date.now(); if(d<=0) return "now"; const m=Math.round(d/MIN_MS);
  if(m<60) return "in ~"+m+" min"; const h=Math.round(m/60); if(h<24) return "in ~"+h+" h"; return "in ~"+Math.round(h/24)+" day(s)"; }
function chunkDiff(chunk,typed){ const otoks=tokenize(chunk.text), orig=otoks.filter(t=>t.t==="w");
  const matched=wordDiff(orig.map(w=>w.c), words(typed).map(w=>w.c));
  let ok=0,wi=-1,html=""; otoks.forEach(t=>{ if(t.t==="sep"){html+=esc(t.x);return;} wi++;
    if(matched[wi]){ ok++; html+='<span class="w correct">'+esc(t.x)+'</span>'; }
    else { html+='<span class="w miss">'+esc(t.x)+'</span>'; weakAdd(chunk.secId, chunk.wordStart+wi); } });
  return {html, acc:orig.length?ok/orig.length:1, ok, total:orig.length}; }

/* --- dashboard hero --- */
function coachHeroHTML(){ buildChunks();
  const tot=CHUNKS.length;
  if(!planStarted()){
    return `<div class="coachwrap"><span class="daybadge">🧭 3-Day Plan</span>
      <h2>Memorise the whole essay in 3 days</h2>
      <p class="goal">A science-backed coach. It splits the essay into ${tot} bite-size lines and drills each with <b>recall + feedback</b>, spaced out and revisited until it sticks — the method researchers call <i>successive relearning</i>. It tells you exactly what to do and when.</p>
      <div class="coachbtns"><button class="btn primary" id="cStart">▶ Start my 3-day plan</button>
        <button class="btn ghost" id="cWhy">ℹ️ Why this works</button></div></div>`;
  }
  const day=planDay(), intro=introducedCount(), mc=masteredCount(), dueNow=dueList().length, newLeft=newList().length, nd=nextDueAt();
  const ready=dueNow>0||newLeft>0;
  return `<div class="coachwrap">
    <div class="coachbtns" style="justify-content:space-between">
      <span class="daybadge">🧭 Day ${day} of 3</span>
      <span class="stepdots">${[1,2,3].map(d=>`<i class="${d<day?'done':d===day?'cur':''}" style="width:24px;border-radius:5px"></i>`).join("")}</span></div>
    <h2>${ready?"Time to practise":"You're ahead — rest, then return"}</h2>
    <p class="goal"><b>Today's goal:</b> ${DAY_GOALS[day]||DAY_GOALS[3]}</p>
    <div class="pgrid">
      <div class="pcell"><b>${mc}/${tot}</b><small>lines mastered</small><div class="pbar"><i style="width:${tot?mc/tot*100:0}%"></i></div></div>
      <div class="pcell"><b>${intro}/${tot}</b><small>introduced</small><div class="pbar"><i style="width:${tot?intro/tot*100:0}%"></i></div></div>
      <div class="pcell"><b>${dueNow}</b><small>due to review now</small></div></div>
    <div class="coachbtns">
      <button class="btn primary" id="cStart">${ready?"▶ Start session":"▶ Practise anyway"}</button>
      ${!ready&&nd?`<span class="pill">next review ${relTime(nd)}</span>`:""}
      <button class="btn good" id="cExam">📝 Mock exam</button>
      <button class="btn ghost" id="cWhy">ℹ️ Why this works</button>
      <button class="btn ghost sm" id="cRestart" title="Restart the 3-day plan">↻</button></div></div>`;
}
function wireCoachHero(){
  if($("cStart")) $("cStart").onclick=()=>startCoachSession();
  if($("cWhy")) $("cWhy").onclick=()=>openScience();
  if($("cExam")) $("cExam").onclick=()=>{ currentSectionId="whole"; startMode("whole","exam"); };
  if($("cRestart")) $("cRestart").onclick=()=>{ if(confirm("Restart the 3-day plan? This resets the coach's schedule (your XP & best scores stay).")){ restartPlan(); renderHome(); } };
}

/* --- session runner --- */
let CO=null;
function startCoachSession(){ if(!planStarted()) startPlan();
  const q=buildSession();
  $("home").classList.add("hidden"); $("panel").classList.add("hidden");
  if(!q.length){ coachAhead(); $("view").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  CO={queue:q,i:0,introduced:0,reviewed:0,accSum:0};
  renderCoachStep(); $("view").scrollIntoView({behavior:"smooth",block:"start"});
}
function coachShell(inner){ const day=planDay();
  const dots=CO?CO.queue.map((_,k)=>`<i class="${k<CO.i?'done':k===CO.i?'cur':''}"></i>`).join(""):"";
  return `<div class="play"><div class="playhead">
    <button class="btn sm ghost" onclick="goHome()">← Exit</button>
    <div class="title">🧭 Coach <span class="tag">Day ${day}${CO?` · ${CO.i+1}/${CO.queue.length}`:""}</span></div>
    <span class="stepdots">${dots}</span></div><div id="cbody">${inner}</div></div>`; }
function renderCoachStep(){ if(CO.i>=CO.queue.length) return coachSummary();
  $("view").innerHTML=coachShell("");
  const step=CO.queue[CO.i];
  if(step.type==="learn") renderLearn(step.c); else renderRecall(step.c,false); }
function renderLearn(c){ const sec=getSection(c.secId);
  $("cbody").innerHTML=`<div class="lede">🆕 New line · ${sec.short}</div>
    <div class="note" style="margin-top:0">Read it, then <b>say it out loud</b> — reciting aloud encodes it far better than reading silently.</div>
    <div class="passage read" style="margin:10px 0">${quoteHL(c.text)}</div>
    <div class="actions"><button class="btn" id="cSpeak">🔊 Hear it</button>
      <button class="btn primary" id="cSaid">I said it aloud ✓ → recall it</button></div>`;
  $("cSpeak").onclick=()=>speak(c.text);
  $("cSaid").onclick=()=>renderRecall(c,true); }
function renderRecall(c,isLearn){ const sec=getSection(c.secId);
  const cue=c.prevText?`<div class="cue">…${esc(tailWords(c.prevText,6))} <b style="color:var(--accent2)">→ ?</b></div>`
    :`<div class="cue">Start of <b>${sec.short}</b> <b style="color:var(--accent2)">→ ?</b></div>`;
  $("cbody").innerHTML=`<div class="lede">✍️ ${isLearn?"Now write it from memory":"Recall · "+sec.short}</div>
    ${cue}
    ${isLearn?`<div class="passage" id="flhint" style="margin-bottom:8px">${flCue(c.text)}</div>`:""}
    <textarea id="cInput" placeholder="type the line from memory…" autocapitalize="sentences" spellcheck="false"
      style="width:100%;min-height:88px;background:#0e0f22;border:2px solid var(--accent);border-radius:13px;color:var(--ink);font-size:17px;padding:12px 14px;outline:none;line-height:1.7"></textarea>
    <div class="actions">
      ${isLearn?"":'<button class="btn" id="cHint">💡 First letters</button>'}
      <button class="btn" id="cReveal">👁 Reveal</button>
      <button class="btn primary" id="cCheck">✓ Check</button></div>
    <div id="cResult"></div>`;
  const ta=$("cInput"); setTimeout(()=>ta.focus(),50);
  if($("cHint")) $("cHint").onclick=()=>{ if(!$("flhint")){ const d=document.createElement("div"); d.className="passage"; d.id="flhint"; d.style.cssText="margin:0 0 8px"; d.innerHTML=flCue(c.text); ta.parentNode.insertBefore(d,ta); } };
  $("cReveal").onclick=()=>{ ta.value=stripBrackets(c.text); ta.focus(); };
  $("cCheck").onclick=()=>gradeStep(c,ta.value); }
function gradeStep(c,typed){ const r=chunkDiff(c,typed), grade=gradeFromAccuracy(r.acc);
  const isLearn=CO.queue[CO.i].type==="learn"; const s=applyGrade(c.id,grade);
  if(isLearn) CO.introduced++; else CO.reviewed++; CO.accSum+=r.acc;
  addXP(grade==="again"?2:grade==="hard"?5:9); if(grade==="easy"||grade==="good") sfx.ok(); else sfx.no();
  const mins=s.intervalMin, when=mins>=1440?`~${Math.round(mins/1440)} day`:mins>=60?`~${Math.round(mins/60)} h`:`~${mins} min`;
  const col=grade==="again"?"var(--bad)":grade==="hard"?"var(--warn)":"var(--good)";
  const label={again:"Try again",hard:"Hard",good:"Good",easy:"Easy!"}[grade];
  $("cCheck").disabled=true;
  $("cResult").innerHTML=`<div class="note" style="margin-top:12px"><b>Marked</b> — <span style="color:var(--good)">green = right</span>, <span style="color:var(--bad)">red = missed</span>:</div>
    <div class="passage diff" style="margin:6px 0">${r.html}</div>
    <div class="actions"><span class="gradechip" style="background:${col}1f;color:${col};border:1px solid ${col}">${label} · ${Math.round(r.acc*100)}% · next review ${when}</span>
      <button class="btn primary" id="cNext">${CO.i+1>=CO.queue.length?"Finish session →":"Next →"}</button></div>`;
  $("cNext").onclick=()=>{ CO.i++; renderCoachStep(); };
  $("cNext").scrollIntoView({block:"center",behavior:"smooth"}); }
function coachSummary(){ bumpStreak();
  SECTIONS.forEach(sec=>{ const cs=CHUNKS.filter(c=>c.secId===sec.id);
    const m=cs.length?Math.round(cs.filter(c=>srsOf(c.id).reps>=CRITERION).length/cs.length*100):0; recordBest(sec.id,"coach",m); });
  const avg=CO.queue.length?Math.round(CO.accSum/CO.queue.length*100):0;
  const dueLeft=dueList().length, newLeft=newList().length, mc=masteredCount(), tot=CHUNKS.length, nd=nextDueAt();
  const more=dueLeft>0||newLeft>0;
  const msg=more?"More is ready now — keep going while you're warm."
    :nd?`You're ahead. Next review is due ${relTime(nd)} — take a break; sleeping between sessions is when memories consolidate.`
    :"🎉 Everything's mastered for now. Try a full mock exam to overlearn it.";
  if(avg>=80) burst();
  $("view").innerHTML=`<div class="play"><div class="result">
    <div class="big">${avg}%</div>
    <div style="color:var(--muted)">Session complete · ${CO.introduced} new learned · ${CO.reviewed} reviewed</div>
    <div class="row">
      <div class="kv"><b>${mc}/${tot}</b><small>lines mastered</small></div>
      <div class="kv"><b>${dueLeft}</b><small>due now</small></div>
      <div class="kv"><b>${newLeft}</b><small>not seen yet</small></div></div>
    <div class="note" style="max-width:50ch;margin:0 auto 12px">${msg}</div>
    <div class="actions" style="justify-content:center">
      ${more?'<button class="btn primary" id="cAgain">▶ Next session</button>':""}
      <button class="btn good" onclick="startMode('whole','exam')">📝 Mock exam</button>
      <button class="btn ghost" onclick="goHome()">← Coach</button></div></div></div>`;
  if($("cAgain")) $("cAgain").onclick=()=>startCoachSession(); }
function coachAhead(){ const nd=nextDueAt();
  $("view").innerHTML=`<div class="play"><div class="result"><div style="font-size:42px">😌</div>
    <div style="margin:10px auto;color:var(--muted);max-width:48ch">Nothing's due right now${nd?` — next review ${relTime(nd)}`:""}. Spacing sessions out (and sleeping between them) is exactly what makes it stick, so come back a little later.</div>
    <div class="actions" style="justify-content:center"><button class="btn good" onclick="startMode('whole','exam')">📝 Mock exam anyway</button><button class="btn ghost" onclick="goHome()">← Coach</button></div></div></div>`; }
function openScience(){ const m=document.createElement("div"); m.className="modal"; m.id="sciModal";
  m.innerHTML=`<div class="box" style="max-width:540px"><h3>🧠 Why this 3-day plan works</h3>
    <ul class="scilist">
      <li><b>Retrieval practice</b> — recalling from memory beats re-reading; testing yourself is one of the most powerful learning effects.</li>
      <li><b>Spacing</b> — short gaps now, longer later (with sleep between days) beat cramming it all at once.</li>
      <li><b>Successive relearning</b> — recall each line correctly ~3× across spaced sessions for durable memory.</li>
      <li><b>Read–Recite–Review + reciting aloud</b> — saying it from memory and out loud encodes more than re-reading.</li>
      <li><b>Errorful generation</b> — attempting (even getting it wrong) then seeing the answer beats just studying.</li>
      <li><b>Chunking & chaining</b> — small lines, rehearsing the joins where people usually slip.</li>
      <li><b>Interleaving & overlearning</b> — mixing paragraphs and timed full write-outs on day 3 lock it in.</li>
    </ul>
    <div class="note" style="margin-top:10px">Evidence: Roediger &amp; Karpicke (2006); Cepeda et al. (2008); Rawson &amp; Dunlosky (2022); McDaniel, Howard &amp; Einstein (2009); Kornell, Hays &amp; Bjork (2009).</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="sciClose">Got it</button></div></div>`;
  $("modalHost").appendChild(m); m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  $("sciClose").onclick=()=>m.remove(); }

/* ============================================================
   SETTINGS MODAL
   ============================================================ */
function openSettings(){ const m=document.createElement("div"); m.className="modal"; m.id="setModal";
  m.innerHTML=`<div class="box"><h3>⚙️ Settings</h3>
    <div class="setrow"><span>🔊 Sound effects</span><button class="btn sm" id="sSound">${state.settings.sound?"On":"Off"}</button></div>
    <div class="setrow"><span>✍️ Forgive spelling<br><small style="color:var(--muted)">accept small typos when you type</small></span><button class="btn sm" id="sFuzzy">${state.settings.fuzzy?"On":"Off"}</button></div>
    <div class="setrow"><span>💡 Default typing hint</span><div class="seg"><button data-h="full">Full</button><button data-h="first">1st</button><button data-h="none">None</button></div></div>
    <div class="setrow"><span>📲 Add to home screen</span><span style="color:var(--muted);font-size:12px;max-width:160px;text-align:right">Use your browser's “Add to Home Screen” to install it as an app.</span></div>
    <div class="setrow"><span>♻️ Reset all progress</span><button class="btn sm" id="sReset" style="border-color:var(--bad);color:var(--bad)">Reset</button></div>
    <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="sClose">Done</button></div></div>`;
  $("modalHost").appendChild(m);
  m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  const mark=()=>m.querySelectorAll("[data-h]").forEach(b=>b.style.background=b.dataset.h===state.settings.hint?"var(--accent)":"transparent"); mark();
  $("sSound").onclick=()=>{ state.settings.sound=!state.settings.sound; save(); $("sSound").textContent=state.settings.sound?"On":"Off"; if(state.settings.sound) sfx.ok(); };
  $("sFuzzy").onclick=()=>{ state.settings.fuzzy=!state.settings.fuzzy; save(); $("sFuzzy").textContent=state.settings.fuzzy?"On":"Off"; toast(state.settings.fuzzy?"Spelling: forgiving":"Spelling: strict"); };
  m.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ state.settings.hint=b.dataset.h; save(); mark(); });
  $("sReset").onclick=()=>{ if(confirm("Reset all progress — XP, levels, streak, best scores and weak words?")){ state=defaults(); save(); refreshHeader(); m.remove(); goHome(); toast("Progress reset"); } };
  $("sClose").onclick=()=>m.remove();
}

/* ============================================================
   PWA + BOOT
   ============================================================ */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; $("installBtn").classList.remove("hidden"); });
$("installBtn").onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("installBtn").classList.add("hidden"); };
window.addEventListener("appinstalled",()=>$("installBtn").classList.add("hidden"));
$("setBtn").onclick=openSettings;
$("streakPill").addEventListener("dblclick",()=>{ if(confirm("Reset all progress?")){ state=defaults(); save(); refreshHeader(); goHome(); toast("Progress reset"); } });

refreshHeader(); renderHome();
window.startMode=startMode; window.goHome=goHome;

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
